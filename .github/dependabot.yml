version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
      dev-tooling:
        patterns:
          - '@nx/*'
          - 'nx'
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'prettier'
          - 'vite'
          - 'vitest'
          - '@vitest/*'
          - 'typescript'
          - '@types/*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - '*'
      type-stubs:
        patterns:
          - 'django-stubs'
          - 'django-stubs-ext'
          - 'djangorestframework-stubs'
          - 'types-*'
          - 'celery-types'
          - 'boto3-stubs'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'

  # App Level Scanning
  - package-ecosystem: 'docker'
    directory: '/apps/nginx'
    schedule:
      interval: 'weekly'
