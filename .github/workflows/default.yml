name: 👷 Monorepo Pipeline

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: 174477281453
  ASSUMED_ROLE: arn:aws:iam::174477281453:role/github-actions-oidc-role
  ECR_REGISTRY: 174477281453.dkr.ecr.us-west-2.amazonaws.com
  COMPOSE_FILE: docker-compose.yml:docker-compose-ci.yml

jobs:
  BuildTestDeploy:
    strategy:
      fail-fast: false
      matrix:
        environment: >-
          ${{ fromJson(
            github.event_name == 'push' && github.ref == 'refs/heads/main'
            && '["preview", "production"]'
            || '["preview"]'
          ) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      actions: read # Required to find the last successful workflow run
      contents: read # Required for actions/checkout
      id-token: write # Required for requesting the JWT
      pull-requests: write # Required to post PR comments
      checks: write # Required for graphql inspector

    steps:
      - name: 🚦 Turnstyle
        uses: softprops/turnstyle@v3.3.3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗 Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Checks out all branches and tags. Maybe we can make this better in the future?

      # This line is needed for nx affected to work when CI is running on a PR
      - name: 🔀 Track main if PR
        if: github.event_name == 'pull_request'
        run: git branch --track main origin/main

      - name: 🔧 Configure NX SHAs
        uses: nrwl/nx-set-shas@v5

      - name: 🔧 Set Environment Variables
        run: |
          RAW_BRANCH_NAME=${{ github.head_ref || github.ref_name }}
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c 1-7)

          # Sanitize branch name by replacing '/' with '-' and removing any other invalid characters
          BRANCH_NAME=$(echo $RAW_BRANCH_NAME | sed 's|/|-|g' | sed 's|[^a-zA-Z0-9_.-]||g')

          if [ "$BRANCH_NAME" == "main" ]; then
            IMAGE_TAG_PREFIX="main"
          else
            IMAGE_TAG_PREFIX="dev-$BRANCH_NAME"
          fi

          DOCKER_TAG="$IMAGE_TAG_PREFIX-$SHORT_SHA"

          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "IMAGE_TAG_PREFIX=$IMAGE_TAG_PREFIX" >> $GITHUB_ENV
          echo "DOCKER_TAG=$DOCKER_TAG" >> $GITHUB_ENV
          echo "MONOREPO_IMAGE=${{ env.ECR_REGISTRY }}/monorepo" >> $GITHUB_ENV
          echo "CACHE_IMAGE=${{ env.ECR_REGISTRY }}/monorepo:buildcache" >> $GITHUB_ENV
          echo "BRANCH_CACHE=${{ env.ECR_REGISTRY }}/monorepo:buildcache-${BRANCH_NAME}" >> $GITHUB_ENV

      - name: 🐳 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ASSUMED_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: 🐳 Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: 🐳 Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Dependencies live in the Actions cache, not in the CI image. The image
      # contains only the toolchain; the checkout and dependencies are mounted.
      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            .venv
            .yarn/cache
            .yarn/install-state.gz
          key: deps-v1-${{ runner.os }}-${{ hashFiles('Dockerfile', 'package.json', 'yarn.lock', 'uv.lock', 'apps/*/package.json', 'apps/betterangels-backend/pyproject.toml') }}

      - name: Ensure CI base image
        id: ci-base
        run: |
          set -euo pipefail
          DOCKERFILE_HASH="$(sha256sum Dockerfile | cut -c1-12)"
          BRANCH_SLUG="$(printf '%s' "$BRANCH_NAME" | sha256sum | cut -c1-16)"
          BRANCH_CI_BASE="$MONOREPO_IMAGE:ci-base-${BRANCH_SLUG}-${DOCKERFILE_HASH}"
          built=false

          if docker pull "$BRANCH_CI_BASE"; then
            echo "Using ${BRANCH_CI_BASE}"
            docker tag "$BRANCH_CI_BASE" "$MONOREPO_IMAGE:ci-base"
          elif [[ -n "${NX_BASE:-}" ]] && git diff --quiet "$NX_BASE" HEAD -- Dockerfile && docker pull "$MONOREPO_IMAGE:ci-base"; then
            echo "Using main ci-base"
          else
            echo "No matching ci-base image; building locally"
            docker build --target ci-base -t "$MONOREPO_IMAGE:ci-base" .
            built=true
          fi

          echo "built=$built" >> "$GITHUB_OUTPUT"
          echo "branch_tag=$BRANCH_CI_BASE" >> "$GITHUB_OUTPUT"

      - name: Push branch CI base
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && steps.ci-base.outputs.built == 'true'
        continue-on-error: true
        run: |
          # ECR's monorepo lifecycle policy expires non-main tags after 7 days,
          # so these per-branch base tags are bounded.
          docker tag "$MONOREPO_IMAGE:ci-base" "${{ steps.ci-base.outputs.branch_tag }}"
          docker push "${{ steps.ci-base.outputs.branch_tag }}"

      - name: Prepare dependency mounts
        run: |
          mkdir -p node_modules .venv .yarn/cache
          sudo chown -R -h 1000:1000 node_modules .venv .yarn

      - name: Ensure dependencies
        run: |
          if [[ -x node_modules/.bin/nx && -x .venv/bin/python ]]; then
            echo "dependency cache is complete"
            exit 0
          fi
          echo "dependency cache is incomplete; reinstalling"
          docker run --rm --user 1000:1000 -e CI=true -e HOME=/home/betterangels \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            "$MONOREPO_IMAGE:ci-base" \
            bash -lc 'yarn install --immutable && uv sync --locked'

      - name: Save dependency cache
        if: steps.deps-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            .venv
            .yarn/cache
            .yarn/install-state.gz
          key: deps-v1-${{ runner.os }}-${{ hashFiles('Dockerfile', 'package.json', 'yarn.lock', 'uv.lock', 'apps/*/package.json', 'apps/betterangels-backend/pyproject.toml') }}

      - name: Restore Nx cache
        id: nx-cache
        uses: actions/cache/restore@v6
        with:
          # Nx 23 indexes cache outputs in SQLite under workspace-data.
          # Cache the directory and its index together: a cache index without
          # its outputs can produce a phantom hit.
          path: |
            .nx/cache
            .nx/workspace-data/*.db*
            .cache/test-db.dump
            .cache/test-db.manifest.json
          # A pull_request run's cache is scoped to refs/pull/.../merge.
          # Re-runs of the same PR can restore it; it cannot seed main.
          # main seeds the shared cache with its own push-triggered run.
          key: nx-cache-v4-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Fallback keys are intentional: the artifact validator below drops
          # DB rows whose cache directories are absent, so a fallback cannot
          # turn into a phantom hit.
          restore-keys: |
            nx-cache-v4-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-
            nx-cache-v4-${{ runner.os }}-${{ github.ref_name }}-
            nx-cache-v4-${{ runner.os }}-${{ github.event.repository.default_branch }}-
            nx-cache-v4-${{ runner.os }}-

      - name: Validate Nx cache artifacts
        run: |
          stale=0
          for db in .nx/workspace-data/*.db; do
            [[ -f "$db" ]] || continue
            while IFS= read -r hash; do
              if [[ ! -d ".nx/cache/$hash" ]]; then
                echo "Nx cache has a DB row without artifacts: $hash"
                stale=1
              fi
            done < <(sqlite3 "$db" "select hash from cache_outputs where is_cache_entry=1;" 2>/dev/null)
          done
          if (( stale )); then
            echo "Clearing the Nx workspace DB so Nx does not report phantom hits"
            rm -f .nx/workspace-data/*.db*
          fi

      - name: 🔑 Prep Container Permissions
        run: |
          # These host directories are bind-mounted into the container. Create
          # them first so Docker doesn't create root-owned mount points.
          mkdir -p .nx/cache .nx/workspace-data .cache .ruff_cache .mypy_cache dist tmp reports coverage
          sudo chown -R -h 1000:1000 $GITHUB_WORKSPACE
          sudo setfacl --modify user:1000:rw /var/run/docker.sock
          sudo setfacl -Rm u:1000:rwX,d:u:1000:rwX $HOME/.docker

      - name: Spin up monorepo environment
        run: |
          docker compose up -d

      - name: 🔒 Check uv.lock is in sync
        run: |
          docker compose run better-angels bash <<'EOF'
          uv lock --check
          EOF

      - name: 🩺 Expo Doctor
        run: |
          docker compose run better-angels bash <<'EOF'
          yarn nx affected -t expo-doctor
          EOF

      - name: 🕵️ Check for missing Django migrations
        run: |
          docker compose run better-angels bash <<'EOF'
          yarn nx affected -t check-migrations
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "Error: Missing Django migrations! Make sure you have run 'python manage.py makemigrations <app_name>' locally and committed the changes."
            exit 1
          else
            echo "Success: No missing Django migrations!"
          fi
          EOF

      - name: 📝 Make sure GraphQL Schema is up to date
        # TODO: Upon graphql mismatch, a github action could commit the changes and push into the branch
        run: |
          docker compose run better-angels bash <<'EOF'
          yarn nx affected -t validate-graphql-schema
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "Error: The GraphQL schemas do not match! Make sure you have run 'yarn nx run-many -t generate-graphql-schema' locally and committed the changes."
            exit 1
          else
            echo "Success: The GraphQL schemas match!"
          fi

          yarn nx affected -t generate-graphql-types
          TYPE_GEN_STATUS=$?
          git diff --exit-code;
          DIFF_STATUS=$?
          if [ $TYPE_GEN_STATUS -ne 0 ] || [ $DIFF_STATUS -ne 0 ]; then
            echo "Error: The GraphQL types do not match or generation failed! Make sure you have run 'yarn nx run-many -t generate-graphql-types' locally and committed the changes."
            exit 1
          else
            echo "Success: The GraphQL types match!"
          fi
          EOF

      - name: 🧹 Lint, typecheck, test, and build
        run: |
          docker compose run better-angels bash <<'EOF'
          # One Nx invocation lets independent targets overlap: lint/typecheck
          # while prepare-test-db builds the database, and the EAS build while
          # the backend suite runs. logical (not auto): xdist's "auto" counts
          # physical cores and under-provisions SMT runners.
          export TEST_DB_WORKERS=logical
          export PYTEST_ADDOPTS="-n logical --durations=25"
          # stream task output so pytest's durations/slowest-test table lands in CI
          yarn nx affected -t lint typecheck test build --configuration ${{ matrix.environment }} --output-style=stream --parallel=6
          EOF
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SHELTER_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_SHELTER_GOOGLE_MAPS_API_KEY }}
          VITE_BETTERANGELS_ADMIN_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_BETTERANGELS_ADMIN_GOOGLE_MAPS_API_KEY }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPO_PUBLIC_IOS_GOOGLEMAPS_APIKEY: ${{ secrets.EXPO_PUBLIC_IOS_GOOGLEMAPS_APIKEY }}
          EXPO_PUBLIC_ANDROID_GOOGLEMAPS_APIKEY: ${{ secrets.EXPO_PUBLIC_ANDROID_GOOGLEMAPS_APIKEY }}
          EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_IOS: ${{ secrets.EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_IOS }}
          EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_ANDROID: ${{ secrets.EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_ANDROID }}

      # Save before deploy/E2E. actions/cache's automatic save is a post-job
      # action and only runs when the whole job succeeds; a deploy failure
      # would otherwise throw away the seeded test DB. Explicit save also
      # replaces the deprecated, non-functional `save-always` input.
      - name: Save Nx cache
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            .nx/cache
            .nx/workspace-data/*.db*
            .cache/test-db.dump
            .cache/test-db.manifest.json
          key: nx-cache-v4-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 🕵🏻‍♂️ GraphQL Inspector
        uses: kamilkisiela/graphql-inspector@v4.0.0
        # Warning: This now skips schema breaking checks in forked repositories.
        # Resolve in: https://betterangels.atlassian.net/browse/DEV-690
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          schema: main:apps/betterangels-backend/schema.graphql
          fail-on-breaking: true
          approve-label: graphql-inspector:approved-breaking-change

      - name: 💬 Post preview link to PR
        if: github.event_name == 'pull_request'
        run: |
          docker compose run better-angels bash <<'EOF'
          yarn nx affected -t post-pr-preview
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}

      - name: 🏗️ Build and push CI base image
        if: matrix.environment == 'production' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          target: ci-base
          push: true
          tags: |
            ${{ env.MONOREPO_IMAGE }}:ci-base
          cache-from: |
            type=registry,ref=${{ env.CACHE_IMAGE }}-main
          cache-to: |
            type=registry,ref=${{ env.CACHE_IMAGE }}-main,mode=max

      - name: 🏗️ Build and push production image
        if: matrix.environment == 'production' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          target: production
          push: true
          tags: |
            ${{ env.MONOREPO_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: |
            type=registry,ref=${{ env.CACHE_IMAGE }}-main
          cache-to: |
            type=registry,ref=${{ env.CACHE_IMAGE }}-main,mode=max

      - name: Build production side-effect images
        if: matrix.environment == 'production'
        run: |
          # imgproxy/nginx push during their build. Their preview builds are
          # cacheable, but a production cache hit would skip the push for this
          # commit's image tag.
          docker compose run better-angels bash <<'EOF'
          yarn nx run-many -t build --projects=imgproxy,nginx --configuration production --skip-nx-cache
          EOF

      - name: 🚀 Deploy Changes
        # `deploy` depends on `export-web` and `export-web` is not cached, so the
        # browser bundle is built here rather than in a second invocation.
        run: |
          docker compose run better-angels bash <<'EOF'
          yarn nx affected -t deploy --configuration ${{ matrix.environment }}
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `deploy` depends on `build`, so shelter-web and betterangels-admin
          # are rebuilt here too. Their bundles inline their Maps keys at build
          # time; without the keys the deployed apps render no map.
          VITE_SHELTER_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_SHELTER_GOOGLE_MAPS_API_KEY }}
          VITE_BETTERANGELS_ADMIN_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_BETTERANGELS_ADMIN_GOOGLE_MAPS_API_KEY }}
          # `deploy` runs `export-web`, so the key must be here or the bundle
          # ships without it.
          EXPO_PUBLIC_WEB_GOOGLEMAPS_JS_APIKEY: ${{ secrets.EXPO_PUBLIC_WEB_GOOGLEMAPS_JS_APIKEY }}

      - name: 🧪 E2E shelter-web (preview)
        # Runs after deploy, because the suite drives the deployed preview: the
        # deploy step only returns once the edge serves the revision just built,
        # so these tests describe this commit rather than whatever was there.
        #
        # Choosing the target — this branch's preview when `shelter-web` was
        # deployed, the existing preview or a skip when only the specs changed —
        # lives in tools/scripts/e2e-shelter.sh, which is runnable locally too.
        # The preview is only rebuilt and redeployed for affected projects, so an
        # untouched shelter-web means the deployed site is unchanged and a run
        # would report on someone else's revision.
        #
        # One step per web property, because each has its own origin. That origin
        # already has a home — `SITE_URL` in the app's `.env.deploy.<config>` —
        # and the script takes it from there. An e2e project already names its
        # app with `implicitDependencies`. (Which is also why this can't be
        # `nx affected -t e2e`: `BASE_URL` is one value for the whole container,
        # so a second suite in the same step would be handed the wrong origin.)
        if: matrix.environment == 'preview'
        run: |
          docker compose run --rm better-angels bash tools/scripts/e2e-shelter.sh

      - name: 📎 Upload shelter-e2e report
        if: always() && matrix.environment == 'preview'
        uses: actions/upload-artifact@v7
        with:
          name: shelter-e2e-report-${{ env.BRANCH_NAME }}
          path: dist/.playwright/apps/shelter-e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: ⏹️ Spin down monorepo environment
        if: always()
        run: |
          docker compose down
          sudo chown -R -h 1001:1001 $GITHUB_WORKSPACE
