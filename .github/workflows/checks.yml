# ✅ Checks — required, fork-safe lane (see docs/ci-contract.md).
#
# This workflow must remain free of secrets, AWS credentials, and write
# effects so that ANY provenance (including forked PRs) can satisfy it.
#
# Workflow-level guards are NOT a security boundary: PR code can edit
# workflow files. The boundary is the absence of capabilities here.
name: ✅ Checks

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:

env:
  COMPOSE_FILE: docker-compose.yml:docker-compose-ci.yml

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read # Required by nx-set-shas
      contents: read # Required for actions/checkout
      checks: write # GraphQL Inspector posts check runs (same-repo PRs only)
      pull-requests: write # GraphQL Inspector reads PR metadata/labels (same-repo PRs only)
    steps:
      - name: 🏗 Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for nx affected and the token-free schema diff

      # This line is needed for nx affected to work when CI is running on a PR
      - name: 🔀 Track main if PR
        if: github.event_name == 'pull_request'
        run: git branch --track main origin/main

      - name: 🔧 Configure NX SHAs
        uses: nrwl/nx-set-shas@v4

      - name: 🔧 Set Environment Variables
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c 1-7)
          # Local image only: no ECR, no registry auth.
          echo "MONOREPO_IMAGE=monorepo" >> $GITHUB_ENV
          echo "DOCKER_TAG=ci-$SHORT_SHA" >> $GITHUB_ENV

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # No registry cache on purpose: forks cannot authenticate to ECR.
      # GHA caches are scoped by GitHub (PR caches cannot be read by main or
      # other PRs), so they are safe on untrusted runs.
      - name: 🏗️ Build Monorepo Docker image
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          load: true
          tags: |
            ${{ env.MONOREPO_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=gha,scope=monorepo-checks
          cache-to: type=gha,scope=monorepo-checks,mode=min

      - name: 🔑 Prep Container Permissions
        run: |
          sudo chown -R 1000:1000 $GITHUB_WORKSPACE
          sudo setfacl --modify user:1000:rw /var/run/docker.sock
          sudo setfacl -Rm u:1000:rwX,d:u:1000:rwX $HOME/.docker

      - name: Spin up monorepo environment
        run: |
          docker compose up -d

      - name: 🔒 Check uv.lock is in sync
        run: |
          docker compose run better-angels bash <<'EOF'
          uv lock --check
          EOF

      - name: 🧹 Lint
        run: |
          docker compose run better-angels bash <<'EOF'
          yarn nx affected -t lint
          EOF

      - name: 🩺 Expo Doctor
        run: |
          docker compose run better-angels bash <<'EOF'
          yarn nx affected -t expo-doctor
          EOF

      - name: 🕵️ Check for missing Django migrations
        run: |
          docker compose run better-angels bash <<'EOF'
          yarn nx affected -t check-migrations
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "Error: Missing Django migrations! Make sure you have run 'python manage.py makemigrations <app_name>' locally and committed the changes."
            exit 1
          else
            echo "Success: No missing Django migrations!"
          fi
          EOF

      - name: 📝 Make sure GraphQL Schema is up to date
        # TODO: Upon graphql mismatch, a github action could commit the changes and push into the branch
        run: |
          docker compose run better-angels bash <<'EOF'
          yarn nx affected -t validate-graphql-schema
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "Error: The GraphQL schemas do not match! Make sure you have run 'yarn nx run-many -t generate-graphql-schema' locally and committed the changes."
            exit 1
          else
            echo "Success: The GraphQL schemas match!"
          fi

          yarn nx affected -t generate-graphql-types
          TYPE_GEN_STATUS=$?
          git diff --exit-code;
          DIFF_STATUS=$?
          if [ $TYPE_GEN_STATUS -ne 0 ] || [ $DIFF_STATUS -ne 0 ]; then
            echo "Error: The GraphQL types do not match or generation failed! Make sure you have run 'yarn nx run-many -t generate-graphql-types' locally and committed the changes."
            exit 1
          else
            echo "Success: The GraphQL types match!"
          fi
          EOF

      - name: 🔬 Typecheck
        run: |
          docker compose run better-angels bash <<'EOF'
          yarn nx affected -t typecheck
          EOF

      - name: 🧪 Test
        run: |
          docker compose run better-angels bash <<'EOF'
          # Exclude Betterangels Frontend Given its CI is not setup yet
          yarn nx affected -t test
          EOF

      - name: 🕵🏻‍♂️ GraphQL Inspector (same-repo PRs)
        uses: kamilkisiela/graphql-inspector@e9db2c45eae85a6afd1adfe0ae2ce0770a9ba165 # pinned: master as of 2026-09-29
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          schema: main:apps/betterangels-backend/schema.graphql
          fail-on-breaking: true
          approve-label: graphql-inspector:approved-breaking-change

      # DEV-690: forks get the same breaking-change gate with no token at all.
      - name: 🕵🏻‍♂️ GraphQL breaking check (fork PRs, token-free)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git show "$BASE_SHA:apps/betterangels-backend/schema.graphql" > /tmp/base-schema.graphql
          npx --yes @graphql-inspector/cli diff /tmp/base-schema.graphql apps/betterangels-backend/schema.graphql

      - name: ⏹️ Spin down monorepo environment
        if: always()
        run: |
          docker compose down
          sudo chown -R 1001:1001 $GITHUB_WORKSPACE
