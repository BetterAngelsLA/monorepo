name: 🧹 EAS Update Branch Cleanup

on:
  pull_request:
    types: [closed]
  # Fork PRs cannot access secrets on `pull_request`, so their namespaced
  # `pr-<number>` EAS branches are cleaned up via pull_request_target.
  pull_request_target:
    types: [closed]

jobs:
  cleanup:
    # Same-repo PRs clean up via pull_request; fork PRs via pull_request_target
    # (the only event that has a token for fork PRs).
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
      || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required to find the last successful workflow run
      contents: read # Required for actions/checkout
    steps:
      - name: 🏗 Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔀 Track main
        run: git branch --track main origin/main

      - name: 🔧 Configure NX SHAs
        uses: nrwl/nx-set-shas@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: 'yarn'

      - name: 🧶 Setup Yarn
        run: corepack enable

      - name: 📦 Install dependencies
        run: yarn install

      - name: 📱 Install EAS CLI
        run: npm install -g eas-cli@20.5.1

      - name: ️ Delete EAS Branches for Affected Projects
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN is not configured; nothing to clean up."
            exit 0
          fi
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            # Bridge runs (/run-full) namespace fork previews under pr-<number>.
            BRANCH_NAME="pr-${{ github.event.pull_request.number }}"
          else
            BRANCH_NAME='${{ github.head_ref || github.ref_name }}'
          fi
          # All projects with an eas-update target; missing branches are skipped below.
          projects=$(yarn nx show projects --withTarget eas-update)
          if [ -z "$projects" ]; then
            echo "No projects with eas-update target"
            exit 0
          fi
          for project in $projects; do
            echo "Deleting EAS branch for project: $project"
            pushd apps/$project > /dev/null
            output=$(eas branch:delete --non-interactive "$BRANCH_NAME" 2>&1) || {
              if echo "$output" | grep -q "Could not find branch"; then
                echo "Branch $BRANCH_NAME does not exist on $project, skipping."
              else
                echo "$output" >&2
                popd > /dev/null
                exit 1
              fi
            }
            popd > /dev/null
          done
