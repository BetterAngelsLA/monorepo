name: 🚀 Preview

on:
  pull_request:

# One preview per branch: overlapping runs would race on the same
# /branches/<branch>/ prefix and on the comment.
concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: 174477281453
  ASSUMED_ROLE: arn:aws:iam::174477281453:role/github-actions-oidc-role

jobs:
  # Web preview + its E2E suite. Kept apart from the mobile job because the EAS
  # targets rewrite the workspace (see Mobile below) and everything here needs a
  # pristine install.
  Preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VITE_SHELTER_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_SHELTER_GOOGLE_MAPS_API_KEY }}
      VITE_BETTERANGELS_ADMIN_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_BETTERANGELS_ADMIN_GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_WEB_GOOGLEMAPS_JS_APIKEY: ${{ secrets.EXPO_PUBLIC_WEB_GOOGLEMAPS_JS_APIKEY }}
      EXPO_PUBLIC_IOS_GOOGLEMAPS_APIKEY: ${{ secrets.EXPO_PUBLIC_IOS_GOOGLEMAPS_APIKEY }}
      EXPO_PUBLIC_ANDROID_GOOGLEMAPS_APIKEY: ${{ secrets.EXPO_PUBLIC_ANDROID_GOOGLEMAPS_APIKEY }}
      EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_IOS: ${{ secrets.EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_IOS }}
      EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_ANDROID: ${{ secrets.EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_ANDROID }}
    steps:
      - name: 🏗 Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔧 Configure NX SHAs
        uses: nrwl/nx-set-shas@v5

      - name: 🔧 Set Environment Variables
        env:
          RAW_BRANCH_NAME: ${{ github.head_ref }}
        run: |
          BRANCH_NAME=$(echo "$RAW_BRANCH_NAME" | sed 's|/|-|g' | sed 's|[^a-zA-Z0-9_.-]||g')
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: 🐳 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ASSUMED_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: yarn

      - name: 📦 Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Restore Nx cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .nx/cache
            .nx/workspace-data/*.db*
          key: nx-cache-v4-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nx-cache-v4-${{ runner.os }}-${{ github.ref_name }}-
            nx-cache-v4-${{ runner.os }}-${{ github.event.repository.default_branch }}-
            nx-cache-v4-${{ runner.os }}-

      - name: 🚀 Preview deploy
        env:
          CI: 'true'
          NX_DAEMON: 'false'
        run: |
          set -euo pipefail
          # export-web computes its own base path, so it is not in the job env.
          yarn nx affected -t export-web deploy post-pr-preview --configuration preview --output-style=stream --parallel=6

      - name: 🧪 E2E
        env:
          CI: 'true'
          NX_DAEMON: 'false'
        run: |
          set -euo pipefail
          set +e
          BASE_URL="$(node tools/shared/resolve-preview-url.mjs)"
          status=$?
          set -e
          if [ "$status" -eq 78 ]; then
            echo "Skipping e2e: no preview for this branch."
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          export BASE_URL
          yarn playwright install chromium
          yarn nx run-many -t e2e --projects=shelter-e2e --configuration preview --output-style=stream

      - name: Save Nx cache
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            .nx/cache
            .nx/workspace-data/*.db*
          key: nx-cache-v4-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 📎 Upload shelter-e2e report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shelter-e2e-report-${{ env.BRANCH_NAME }}
          path: dist/.playwright/apps/shelter-e2e
          if-no-files-found: ignore
          retention-days: 7

  # Mobile preview: one EAS Build per fingerprint, the EAS Update for the branch,
  # and the PR comment linking both.
  #
  # Its own job on purpose: `eas-build`/`eas-update` run `copy-lockfile`
  # (tools/scripts/eas-build-pre-install.mjs), which rewrites the root
  # package.json into a single-package workspace so EAS Build's `yarn install`
  # can resolve the app. That mutation is what EAS needs and is exactly what any
  # later `nx` target in the same workspace must not see.
  Mobile:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Builds are the expensive part of this pipeline, so a PR preview builds a
      # single platform — an APK anyone can install — rather than paying for
      # android + ios + an ios simulator binary on every push. The EAS Update is
      # still published for every platform. Also drives the PR comment's columns.
      EAS_BUILD_PLATFORMS: android
      EXPO_PUBLIC_WEB_GOOGLEMAPS_JS_APIKEY: ${{ secrets.EXPO_PUBLIC_WEB_GOOGLEMAPS_JS_APIKEY }}
      EXPO_PUBLIC_IOS_GOOGLEMAPS_APIKEY: ${{ secrets.EXPO_PUBLIC_IOS_GOOGLEMAPS_APIKEY }}
      EXPO_PUBLIC_ANDROID_GOOGLEMAPS_APIKEY: ${{ secrets.EXPO_PUBLIC_ANDROID_GOOGLEMAPS_APIKEY }}
      EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_IOS: ${{ secrets.EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_IOS }}
      EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_ANDROID: ${{ secrets.EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_ANDROID }}
    steps:
      - name: 🏗 Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔧 Configure NX SHAs
        uses: nrwl/nx-set-shas@v5

      - name: 🔧 Set Environment Variables
        env:
          RAW_BRANCH_NAME: ${{ github.head_ref }}
        run: |
          BRANCH_NAME=$(echo "$RAW_BRANCH_NAME" | sed 's|/|-|g' | sed 's|[^a-zA-Z0-9_.-]||g')
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: yarn

      - name: 📦 Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: 🥟 Install EAS CLI
        run: npm install -g eas-cli@24.8.0

      - name: 📱 Mobile preview
        env:
          CI: 'true'
          NX_DAEMON: 'false'
        run: |
          set -euo pipefail
          yarn nx run betterangels:write-eas-env:preview

          # EAS prebuilds inside the app, so do the same instead of from the root.
          yarn nx run betterangels:prebuild

          # `eas-build` rewrites the workspace for EAS Build before it uploads
          # (copy-lockfile pins the star deps and declares the app the single
          # workspace), and the runtime it sends is computed from that state. Do
          # the same here, or we look up and then build a runtime the build will
          # never produce. Nothing after this point needs the pristine workspace:
          # the rest of the job is EAS calls.
          yarn nx run betterangels:copy-lockfile

          # The resolver prints the whole fingerprint, so take just the runtime.
          runtime_version() {
            (cd apps/betterangels && "$GITHUB_WORKSPACE/node_modules/.bin/expo-updates" \
              runtimeversion:resolve --platform "$1" --workflow generic) \
              | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => console.log(JSON.parse(s).runtimeVersion))'
          }

          # Skip the build when one already exists for this runtime and profile.
          # Status does not matter: a fingerprint builds once, so a queued,
          # finished, or even a failed build is reused instead of rebuilt. Any
          # lookup failure falls back to building.
          has_build() {
            if (cd apps/betterangels && eas build:list --platform "$1" --runtime-version "$3" \
              --build-profile "$2" --limit 1 --json --non-interactive) \
              > /tmp/build-list.json 2>&1; then
              if node tools/scripts/has-build.mjs < /tmp/build-list.json; then
                echo "Reusing the existing $1 build for $2."
                return 0
              fi
              return 1
            fi
            echo "build:list failed for $1/$2; building instead:"
            tail -5 /tmp/build-list.json
            return 1
          }

          IFS=',' read -ra PLATFORMS <<< "$EAS_BUILD_PLATFORMS"
          for PLATFORM in "${PLATFORMS[@]}"; do
            RUNTIME="$(runtime_version "$PLATFORM")"
            echo "$PLATFORM runtime: $RUNTIME"
            has_build "$PLATFORM" preview "$RUNTIME" \
              || yarn nx run betterangels:eas-build:preview --platform="$PLATFORM" --wait=false --freezeCredentials=true --json=true
          done

          # Publishes the update for every platform the app supports. The branch
          # is explicit: `--auto` reads the git branch, and a CI checkout is a
          # detached HEAD, which publishes to a branch literally named "HEAD".
          yarn nx affected -t eas-update --configuration preview --branch "$BRANCH_NAME" --output-style=stream

          # Mobile preview links (build, update, QR) on the PR.
          yarn nx run betterangels:preview-comment
