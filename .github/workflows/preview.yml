name: 🚀 Preview

on:
  pull_request:

# One preview per branch: overlapping runs would race on the same
# /branches/<branch>/ prefix and on the comment.
concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: 174477281453
  ASSUMED_ROLE: arn:aws:iam::174477281453:role/github-actions-oidc-role

jobs:
  # One job: the EAS update publishes while the web deploy runs (they need nothing
  # from each other), then the E2E suite, then the mobile build. The mobile step
  # has to be last: `eas-build` runs `copy-lockfile`
  # (tools/scripts/eas-build-pre-install.mjs), which rewrites the workspace for
  # EAS Build (root package.json becomes a single-app workspace). A later
  # `yarn install` — which `sync-deps` triggers — then prunes the other projects
  # and the web export dies, so everything that needs the pristine install runs
  # above it.
  #
  # The job itself is not gated on forks: `Preview` can then be a required check
  # that always reports. Fork PRs get no secrets, so the steps that need them
  # carry the guard instead, and the job still tells a fork author what was
  # skipped.
  Preview:
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # `EAS_BUILD_PLATFORMS` is decided per run in "Set Environment Variables"
      # from what the change can affect — see the comment there.
      # Applying this label rebuilds even though a build already exists for the
      # fingerprint — the escape hatch for a build that failed for a reason we
      # have since fixed.
      FORCE_EAS_BUILD: ${{ contains(github.event.pull_request.labels.*.name, 'force-eas-build') }}
      # Applying this label re-pushes the EAS environment even when every var is
      # already there: the deliberate path for rotating a secret (see
      # tools/scripts/sync-eas-env.mjs).
      FORCE_EAS_ENV_SYNC: ${{ contains(github.event.pull_request.labels.*.name, 'force-eas-env-sync') }}
      VITE_SHELTER_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_SHELTER_GOOGLE_MAPS_API_KEY }}
      VITE_BETTERANGELS_ADMIN_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_BETTERANGELS_ADMIN_GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_WEB_GOOGLEMAPS_JS_APIKEY: ${{ secrets.EXPO_PUBLIC_WEB_GOOGLEMAPS_JS_APIKEY }}
      EXPO_PUBLIC_IOS_GOOGLEMAPS_APIKEY: ${{ secrets.EXPO_PUBLIC_IOS_GOOGLEMAPS_APIKEY }}
      EXPO_PUBLIC_ANDROID_GOOGLEMAPS_APIKEY: ${{ secrets.EXPO_PUBLIC_ANDROID_GOOGLEMAPS_APIKEY }}
      EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_IOS: ${{ secrets.EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_IOS }}
      EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_ANDROID: ${{ secrets.EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_ANDROID }}
    steps:
      - name: ⏭️ Fork pull request
        if: github.event.pull_request.head.repo.fork
        run: |
          echo "::notice::Fork PR: previews need secrets, which forks do not receive. Checks-only run."
          {
            echo "### Preview skipped"
            echo
            echo "This pull request comes from a fork, so the deploy, E2E and EAS steps have no secrets to use."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🏗 Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔧 Configure NX SHAs
        uses: nrwl/nx-set-shas@v5

      - name: 🔧 Set Environment Variables
        env:
          RAW_BRANCH_NAME: ${{ github.head_ref }}
          PREVIEW_PLATFORMS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'preview-platforms') }}
        run: |
          set -euo pipefail
          BRANCH_NAME=$(echo "$RAW_BRANCH_NAME" | sed 's|/|-|g' | sed 's|[^a-zA-Z0-9_.-]||g')
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

          # Build what this change can affect, not one platform and not all of
          # them. Android is always built: it is the installable artifact a
          # reviewer uses. iOS is added only when the native binary or its config
          # changed, because a JS-only change reaches the device through the EAS
          # Update — paying for an ios build then buys nothing. The
          # `preview-platforms` label forces both.
          NATIVE_PATTERN='^(package\.json|yarn\.lock|apps/betterangels/(app\.config\.js|app\.json|eas\.json|package\.json|ios/|android/))'
          CHANGED="$(git diff --name-only "$NX_BASE" "$NX_HEAD" || true)"
          if [ "${PREVIEW_PLATFORMS_LABEL:-false}" = 'true' ]; then
            PLATFORMS='android,ios'
            echo 'preview-platforms label: building both platforms.'
          elif printf '%s\n' "$CHANGED" | grep -Eq "$NATIVE_PATTERN"; then
            PLATFORMS='android,ios'
            echo 'Native code or build config changed; building both platforms:'
            printf '%s\n' "$CHANGED" | grep -E "$NATIVE_PATTERN" | head -10
          else
            PLATFORMS='android'
            echo 'JS-only change; android only (iOS ships through the update).'
          fi
          echo "EAS_BUILD_PLATFORMS=$PLATFORMS" >> "$GITHUB_ENV"

      - name: 🐳 Configure AWS credentials
        if: github.event.pull_request.head.repo.fork == false
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ASSUMED_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: yarn

      # `--immutable` still reconciles anything stale; the cache only skips the
      # work of rebuilding an identical tree. Keyed on the lockfile, so a
      # dependency change is a miss by construction.
      - name: ♻️ Restore node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: 📦 Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Restore Nx cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .nx/cache
            .nx/workspace-data/*.db*
          key: nx-cache-v4-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nx-cache-v4-${{ runner.os }}-${{ github.ref_name }}-
            nx-cache-v4-${{ runner.os }}-${{ github.event.repository.default_branch }}-
            nx-cache-v4-${{ runner.os }}-

      - name: 🥟 Install EAS CLI
        if: github.event.pull_request.head.repo.fork == false
        run: npm install -g eas-cli@24.8.0

      - name: 🚀 Preview deploy and EAS update
        if: github.event.pull_request.head.repo.fork == false
        env:
          CI: 'true'
          NX_DAEMON: 'false'
        run: |
          set -euo pipefail

          # The update runs while the web deploy does, because it is the other
          # ~2 minutes of a preview and the two do not share anything that
          # conflicts. It needs neither `copy-lockfile` nor `sync-deps`:
          # `copy-lockfile` reshapes the workspace for the *build* archive, and the
          # runtime version is identical either way — resolving the fingerprint
          # before and after it returns the same hash.
          #
          # Both scripts are called directly rather than through `nx run`: the
          # deploy below is a second Nx process, and two of them on one workspace
          # contend on the project graph and its locks.
          node tools/scripts/write-eas-env.mjs --project betterangels --profile preview
          node tools/scripts/sync-eas-env.mjs --project betterangels --environment development
          # `.env.local` was only the input to that push: the update and the build
          # both take their env from EAS (`--environment`), and leaving the file
          # here would also load it into the *web* export below, which resolves
          # `EXPO_PUBLIC_*` from `.env` today.
          rm -f apps/betterangels/.env.local
          (
            node tools/scripts/eas-update.mjs --project betterangels --profile preview \
              > /tmp/eas-update.log 2>&1
            echo $? > /tmp/eas-update.status
          ) &
          UPDATE_PID=$!

          # export-web computes its own base path, so it is not in the job env.
          yarn nx affected -t export-web deploy post-pr-preview --configuration preview --output-style=stream --parallel=6

          # Reap the update: its output is buffered, so replay it, and fail the
          # step if it failed. Waiting is cheap — it has had the whole deploy to
          # finish.
          set +e
          wait "$UPDATE_PID"
          set -e
          cat /tmp/eas-update.log
          [ "$(cat /tmp/eas-update.status)" = '0' ]

      - name: 🧪 E2E (Playwright)
        if: github.event.pull_request.head.repo.fork == false
        env:
          CI: 'true'
          NX_DAEMON: 'false'
        run: |
          set -euo pipefail
          # Which apps this run deployed, straight from Nx. Each suite's config
          # reads it to choose between its branch preview and its own dev server
          # (tools/shared/e2e-base-url.mjs), so the workflow names no app and no
          # project: `nx run-many --projects=tag:ci-e2e` picks the suites, and a
          # project opts in by carrying the tag.
          PREVIEW_DEPLOYED_APPS="$(yarn nx show projects --affected --with-target deploy --configuration preview | tr '\n' ',')"
          export PREVIEW_DEPLOYED_APPS
          echo "Deployed for this run: ${PREVIEW_DEPLOYED_APPS:-none}"
          yarn playwright install chromium
          yarn nx run-many -t e2e --projects=tag:ci-e2e --configuration preview --output-style=stream

      - name: 📱 Mobile preview
        if: github.event.pull_request.head.repo.fork == false
        env:
          CI: 'true'
          NX_DAEMON: 'false'
        run: |
          set -euo pipefail
          # `copy-lockfile` below rewrites the root package.json for EAS Build.
          # Undo that however this step ends — success, failure, or cancel — so no
          # later step (or a step someone adds later) reads an EAS-shaped
          # workspace. It cannot un-prune `node_modules`, which is why the mobile
          # work still runs after the web export and E2E.
          #
          # Called directly rather than through `nx run`: this must not need a
          # project graph built from the manifests it is undoing.
          trap 'node tools/scripts/restore-workspace.mjs --project betterangels || true' EXIT
          yarn nx run betterangels:write-eas-env:preview

          # No `expo prebuild` here on purpose: it would leave `android/` and
          # `ios/` in the checkout, and `eas update` fingerprints the project as
          # it finds it — with native directories present it publishes a runtime
          # no build ever produces, so the update reaches nobody. The build gets
          # its native projects on the EAS worker (`.easignore` excludes them).

          # `eas-build` rewrites the workspace for EAS Build before it uploads
          # (copy-lockfile pins the star deps and declares the app the single
          # workspace), and the runtime it sends is computed from that state. Do
          # the same here, or we look up and then build a runtime the build will
          # never produce. Everything that needs the pristine install — the web
          # export and the E2E suite — has already run; what follows is EAS calls
          # and archiving.
          yarn nx run betterangels:copy-lockfile

          # The resolver prints the whole fingerprint, so take just the runtime.
          runtime_version() {
            (cd apps/betterangels && "$GITHUB_WORKSPACE/node_modules/.bin/expo-updates" \
              runtimeversion:resolve --platform "$1" --workflow generic) \
              | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => console.log(JSON.parse(s).runtimeVersion))'
          }

          # Reuse the build that already exists for this runtime and profile.
          # `find-build.mjs` holds the rule — a fingerprint builds once, in any
          # status, and never twice; `force-eas-build` is the way out when a
          # failed build has poisoned its fingerprint. It also refuses to answer
          # "no build" when EAS cannot be reached, so a transient error cannot
          # quietly buy a duplicate build: this step fails instead.
          IFS=',' read -ra PLATFORMS <<< "$EAS_BUILD_PLATFORMS"
          for PLATFORM in "${PLATFORMS[@]}"; do
            RUNTIME="$(runtime_version "$PLATFORM")"
            echo "$PLATFORM runtime: $RUNTIME"
            EXISTING="$(node tools/scripts/find-build.mjs --project betterangels \
              --platform "$PLATFORM" --profile preview --runtime "$RUNTIME")"
            if [ -n "$EXISTING" ]; then
              echo "Reusing the existing $PLATFORM build: $EXISTING"
              continue
            fi
            yarn nx run betterangels:eas-build:preview --platform="$PLATFORM" --wait=false --freezeCredentials=true --json=true
          done

          # The update itself was published by the deploy step, in parallel with
          # the web deploy. It pins the branch and the EAS environment:
          # `--auto` would read the git branch and a CI checkout is a detached
          # HEAD (publishing to a branch named "HEAD"), and without --environment
          # eas-cli skips the EAS env vars, so the update would get a different
          # runtime than the build.

          # Mobile preview links (build, update, QR) on the PR.
          yarn nx run betterangels:preview-comment

      # Neither of these touches the workspace; they only archive what the E2E
      # step produced, which is why they can follow the mobile work.
      - name: Save Nx cache
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            .nx/cache
            .nx/workspace-data/*.db*
          key: nx-cache-v4-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 📎 Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Every suite's preset writes under dist/.playwright/apps/<project>,
          # so one upload covers whichever suites ran.
          name: playwright-report-${{ env.BRANCH_NAME }}
          path: dist/.playwright/apps
          if-no-files-found: ignore
          retention-days: 7
