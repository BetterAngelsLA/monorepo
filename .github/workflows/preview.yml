name: 🚀 Preview

on:
  pull_request:

# One preview per branch: overlapping runs would race on the same
# /branches/<branch>/ prefix and on the comment.
concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: 174477281453
  ASSUMED_ROLE: arn:aws:iam::174477281453:role/github-actions-oidc-role

jobs:
  Preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      VITE_SHELTER_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_SHELTER_GOOGLE_MAPS_API_KEY }}
      VITE_BETTERANGELS_ADMIN_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_BETTERANGELS_ADMIN_GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_WEB_GOOGLEMAPS_JS_APIKEY: ${{ secrets.EXPO_PUBLIC_WEB_GOOGLEMAPS_JS_APIKEY }}
      EXPO_PUBLIC_IOS_GOOGLEMAPS_APIKEY: ${{ secrets.EXPO_PUBLIC_IOS_GOOGLEMAPS_APIKEY }}
      EXPO_PUBLIC_ANDROID_GOOGLEMAPS_APIKEY: ${{ secrets.EXPO_PUBLIC_ANDROID_GOOGLEMAPS_APIKEY }}
      EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_IOS: ${{ secrets.EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_IOS }}
      EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_ANDROID: ${{ secrets.EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_ANDROID }}
    steps:
      - name: 🏗 Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔧 Configure NX SHAs
        uses: nrwl/nx-set-shas@v5

      - name: 🔧 Set Environment Variables
        env:
          RAW_BRANCH_NAME: ${{ github.head_ref }}
        run: |
          BRANCH_NAME=$(echo "$RAW_BRANCH_NAME" | sed 's|/|-|g' | sed 's|[^a-zA-Z0-9_.-]||g')
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: 🐳 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ASSUMED_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: yarn

      - name: 📦 Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: 🥟 Install EAS CLI
        run: npm install -g eas-cli@24.8.0

      - name: Restore Nx cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .nx/cache
            .nx/workspace-data/*.db*
          key: nx-cache-v4-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nx-cache-v4-${{ runner.os }}-${{ github.ref_name }}-
            nx-cache-v4-${{ runner.os }}-${{ github.event.repository.default_branch }}-
            nx-cache-v4-${{ runner.os }}-

      - name: 🚀 Preview deploys
        env:
          CI: 'true'
          NX_DAEMON: 'false'
        run: |
          set -euo pipefail
          yarn nx run betterangels:write-eas-env:preview

          # Mirror the build environment before fingerprinting: the pre-install
          # hook resolves star deps and copies packageManager/overrides into the
          # app package.json, and those files are part of the fingerprint. EAS
          # prebuilds inside the app, so do the same instead of from the root.
          yarn nx run betterangels:copy-lockfile
          yarn nx run betterangels:prebuild
          # The resolver prints the whole fingerprint, so take just the runtime.
          runtime_version() {
            (cd apps/betterangels && "$GITHUB_WORKSPACE/node_modules/.bin/expo-updates" \
              runtimeversion:resolve --platform "$1" --workflow generic) \
              | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => console.log(JSON.parse(s).runtimeVersion))'
          }
          ANDROID_RUNTIME="$(runtime_version android)"
          IOS_RUNTIME="$(runtime_version ios)"
          echo "android runtime: $ANDROID_RUNTIME"
          echo "ios runtime: $IOS_RUNTIME"

          # Skip a build when one already exists for this runtime and profile.
          # A queued build counts: the update only needs the runtime to be the one
          # the binary will ship with; a failed one is ignored by the script.
          # Any lookup failure falls back to building.
          has_build() {
            if (cd apps/betterangels && eas build:list --platform "$1" --runtime-version "$2" \
              --build-profile "$3" --limit 1 --json --non-interactive) \
              > /tmp/build-list.json 2>&1; then
              if node tools/scripts/has-build.mjs < /tmp/build-list.json; then
                echo "Reusing the existing $1 build for $3."
                return 0
              fi
              return 1
            fi
            echo "build:list failed for $1/$3; building instead:"
            tail -5 /tmp/build-list.json
            return 1
          }

          has_build android "$ANDROID_RUNTIME" preview \
            || yarn nx run betterangels:eas-build:preview --platform=android --wait=false --freezeCredentials=true --json=true

          has_build ios "$IOS_RUNTIME" preview \
            || yarn nx run betterangels:eas-build:preview --platform=ios --wait=false --freezeCredentials=true --json=true

          has_build ios "$IOS_RUNTIME" development-simulator \
            || yarn nx run betterangels:eas-build:preview --profile=development-simulator --platform=ios --wait=false --freezeCredentials=true --json=true

      - name: 🩺 Build log (temporary)
        continue-on-error: true
        run: |
          cd apps/betterangels
          eas build:view 16c3ca8c-c448-45b6-9676-353c302b4141 --json > /tmp/b.json 2>&1 || true
          url=$(node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("/tmp/b.json", "utf8");
            const s = raw.indexOf("{"), e = raw.lastIndexOf("}");
            const b = JSON.parse(raw.slice(s, e + 1));
            const f = (b.logFiles || [])[0];
            console.log(typeof f === "string" ? f : (f && f.url) || "");
          ')
          echo "log url length: ${#url}"
          code=$(curl -sS -L --compressed -o /tmp/phase.log -w '%{http_code}' "$url")
          echo "http=$code bytes=$(wc -c < /tmp/phase.log)"
          echo '--- tail of the build log ---'
          tail -60 /tmp/phase.log

          # export-web computes its own base path, so it is not in the job env.
          yarn nx affected -t eas-update export-web deploy post-pr-preview --configuration preview --output-style=stream --parallel=6

          # Mobile preview links (builds, updates, QR, simulator) on the PR.
          yarn nx run betterangels:preview-comment

      - name: 🧪 E2E
        env:
          CI: 'true'
          NX_DAEMON: 'false'
        run: |
          set -euo pipefail
          set +e
          BASE_URL="$(node tools/shared/resolve-preview-url.mjs)"
          status=$?
          set -e
          if [ "$status" -eq 78 ]; then
            echo "Skipping e2e: no preview for this branch."
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          export BASE_URL
          yarn playwright install chromium
          yarn nx run-many -t e2e --projects=shelter-e2e --configuration preview --output-style=stream

      - name: Save Nx cache
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            .nx/cache
            .nx/workspace-data/*.db*
          key: nx-cache-v4-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 📎 Upload shelter-e2e report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shelter-e2e-report-${{ env.BRANCH_NAME }}
          path: dist/.playwright/apps/shelter-e2e
          if-no-files-found: ignore
          retention-days: 7
