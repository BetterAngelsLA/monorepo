# Maestro E2E tests — orchestrated from GitHub Actions.
#
# Handles all setup that needs GitHub Secrets and NX monorepo tooling:
#   1. Compute fingerprint (needs EXPO_PUBLIC_* secrets)
#   2. Find existing preview builds (via NX build-list target)
#   3. Publish EAS Update (via NX eas-update target)
#   4. Trigger the EAS Maestro workflow (eas workflow:run)
#
# The EAS workflow (.eas/workflows/e2e-test.yml) only runs Maestro tests.
#
# Prerequisite: the referral flows require the `ffReferrals` waffle flag to be
# enabled in the environment the build points at (the preview profile's
# EXPO_PUBLIC_API_URL). Waffle resolves an unknown flag to false, which hides
# the Referrals tab, so those flows fail without it. See
# apps/betterangels/.maestro/README.md → "Feature Flags (ffReferrals)".
# The preflight step below reports the flag state (non-blocking, no credentials).
#
# Triggers:
#   - Comment "/run-e2e" on a PR          (affected projects)
#   - Comment "/run-e2e <project>" on a PR (specific project)
#   - Manually via the Actions tab (workflow_dispatch)
#   - Merge queue (automatic gating)
name: 🧪 Maestro E2E Tests

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test'
        required: true
        type: number
      project:
        description: 'Specific project to test (blank = affected)'
        required: false
        type: string
  merge_group:
    types: [checks_requested]

jobs:
  e2e:
    if: >-
      github.event_name == 'merge_group'
      || github.event_name == 'workflow_dispatch'
      || (
        github.event.issue.pull_request
        && startsWith(github.event.comment.body, '/run-e2e')
        && contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: 🚀 React to comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: 🔍 Resolve PR ref and project
        id: pr
        uses: actions/github-script@v7
        env:
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number || '0' }}
          INPUT_PROJECT: ${{ github.event.inputs.project || '' }}
        with:
          script: |
            let prNumber = 0;
            let project = '';

            if (context.eventName === 'issue_comment') {
              prNumber = context.issue.number;
              const parts = context.payload.comment.body.trim().split(/\s+/);
              if (parts.length > 1) project = parts[1];
            } else if (context.eventName === 'workflow_dispatch') {
              prNumber = Number(process.env.INPUT_PR_NUMBER);
              project = process.env.INPUT_PROJECT || '';
            }

            if (prNumber) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              core.setOutput('ref', pr.head.ref);
              core.setOutput('sha', pr.head.sha);
            } else {
              // merge_group — ref and sha come from the event directly
              core.setOutput('ref', process.env.GITHUB_REF_NAME);
              core.setOutput('sha', process.env.GITHUB_SHA);
            }

            core.setOutput('project', project.trim());

      - name: 🏗 Check out repo
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0

      - name: 🔎 Preflight — ffReferrals on the target API
        # Reports whether the referral flows' prerequisite flag is enabled in the
        # environment the preview/dev builds point at, so a failing run explains
        # itself in its own log instead of looking like a flaky UI test.
        #
        # Deliberately non-blocking (continue-on-error + always exit 0): the flag
        # is server-side state outside this repo, and the dev API being
        # unreachable must not fail the pipeline before it starts. The Maestro
        # flows remain the gate. To make it fail fast instead, drop
        # continue-on-error and exit 1 in the inactive/missing branches.
        #
        # The featureControls query needs no credentials: the field declares no
        # permission class (apps/betterangels-backend/common/graphql/schema.py)
        # and the schema applies no auth extension. It must be sent as a GET,
        # though: a POST to the deployed endpoint is rejected by Django CSRF
        # (403), while the equivalent GET query is served anonymously. Verified
        # against the dev API.
        #
        # Only betterangels has an eas-e2e target, so this reads its eas.json.
        continue-on-error: true
        run: |
          set -uo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            echo "::notice::jq is unavailable; skipping the ffReferrals preflight."
            exit 0
          fi

          # Single source of truth: the API the dev/preview builds talk to.
          API_URL="$(jq -r '.build.preview.env.EXPO_PUBLIC_API_URL // empty' apps/betterangels/eas.json)"
          if [ -z "${API_URL}" ]; then
            echo "::notice::Could not read EXPO_PUBLIC_API_URL from apps/betterangels/eas.json; skipping the ffReferrals preflight."
            exit 0
          fi

          GRAPHQL_URL="${API_URL%/}/graphql"

          if ! RESPONSE="$(curl -sS --max-time 20 -G "${GRAPHQL_URL}" \
              --data-urlencode 'query={ featureControls { flags { name isActive } } }' 2>/dev/null)"; then
            echo "::warning::${GRAPHQL_URL} did not answer the featureControls query; cannot confirm ffReferrals is enabled. Referral E2E flows may fail."
            exit 0
          fi

          if ! printf '%s' "${RESPONSE}" | jq -e . >/dev/null 2>&1; then
            echo "::warning::${GRAPHQL_URL} returned a non-JSON response to the featureControls query; cannot confirm ffReferrals is enabled."
            exit 0
          fi

          # NB: `first // "missing"` would be wrong here — jq's `//` treats
          # `false` as absent, so an inactive flag would read as missing.
          FLAG_STATE="$(printf '%s' "${RESPONSE}" \
            | jq -r '[.data.featureControls.flags[]? | select(.name == "ffReferrals") | .isActive] as $f
                     | if ($f | length) == 0 then "missing" else ($f[0] | tostring) end')"

          case "${FLAG_STATE}" in
            true)
              echo "✅ ffReferrals is enabled on ${GRAPHQL_URL}."
              ;;
            false)
              echo "::warning::ffReferrals exists on ${GRAPHQL_URL} but is INACTIVE. The referral E2E flows (referrals_page, referral_create, referral_draft) will fail. Enable it in the Django admin for that environment — see apps/betterangels/.maestro/README.md → 'Feature Flags (ffReferrals)'."
              ;;
            *)
              echo "::warning::ffReferrals does not exist on ${GRAPHQL_URL} (waffle resolves an unknown flag to false). The referral E2E flows (referrals_page, referral_create, referral_draft) will fail. Create and enable it in the Django admin for that environment — see apps/betterangels/.maestro/README.md → 'Feature Flags (ffReferrals)'."
              ;;
          esac

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### ffReferrals preflight"
              echo ""
              echo "| Target API | \`ffReferrals\` |"
              echo "| --- | --- |"
              echo "| \`${GRAPHQL_URL}\` | **${FLAG_STATE}** |"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: 🔀 Track main for NX affected
        run: git branch --track main origin/main || true

      - name: 🔧 Configure NX SHAs
        uses: nrwl/nx-set-shas@v4

      - name: ⎔ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: yarn

      - name: 📦 Install dependencies
        run: yarn install

      - name: 📱 Install EAS CLI
        run: npm install -g eas-cli@20.5.1

      - name: 🧪 Run E2E orchestration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BRANCH_NAME: ${{ steps.pr.outputs.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_STATUS_SHA: ${{ steps.pr.outputs.sha }}
          EXPO_PUBLIC_IOS_GOOGLEMAPS_APIKEY: ${{ secrets.EXPO_PUBLIC_IOS_GOOGLEMAPS_APIKEY }}
          EXPO_PUBLIC_ANDROID_GOOGLEMAPS_APIKEY: ${{ secrets.EXPO_PUBLIC_ANDROID_GOOGLEMAPS_APIKEY }}
          EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_IOS: ${{ secrets.EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_IOS }}
          EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_ANDROID: ${{ secrets.EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_ANDROID }}
          MAESTRO_BA_USER_EMAIL: ${{ secrets.MAESTRO_BA_USER_EMAIL }}
          MAESTRO_BA_USER_PASSWORD: ${{ secrets.MAESTRO_BA_USER_PASSWORD }}
        run: |
          PROJECT="${{ steps.pr.outputs.project }}"
          if [ -n "$PROJECT" ]; then
            yarn nx run "$PROJECT:eas-e2e"
          else
            yarn nx affected -t eas-e2e
          fi
