name: 🧪 E2E

on:
  pull_request:
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: 174477281453
  ASSUMED_ROLE: arn:aws:iam::174477281453:role/github-actions-oidc-role

jobs:
  shelter-e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VITE_SHELTER_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_SHELTER_GOOGLE_MAPS_API_KEY }}
      VITE_BETTERANGELS_ADMIN_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_BETTERANGELS_ADMIN_GOOGLE_MAPS_API_KEY }}
    steps:
      - name: 🏗 Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔧 Configure NX SHAs
        uses: nrwl/nx-set-shas@v5

      - name: 🔧 Set Environment Variables
        env:
          RAW_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          BRANCH_NAME=$(echo "$RAW_BRANCH_NAME" | sed 's|/|-|g' | sed 's|[^a-zA-Z0-9_.-]||g')
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: 🐳 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ASSUMED_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: yarn

      - name: 📦 Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: 🎭 Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Restore Nx cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .nx/cache
            .nx/workspace-data/*.db*
          key: nx-cache-v4-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nx-cache-v4-${{ runner.os }}-${{ github.ref_name }}-
            nx-cache-v4-${{ runner.os }}-${{ github.event.repository.default_branch }}-
            nx-cache-v4-${{ runner.os }}-

      - name: 🧪 Run shelter E2E
        env:
          CI: 'true'
          NX_DAEMON: 'false'
        run: yarn nx run shelter-e2e:e2e:preview --output-style=stream

      - name: 📎 Upload shelter-e2e report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shelter-e2e-report-${{ env.BRANCH_NAME }}
          path: dist/.playwright/apps/shelter-e2e
          if-no-files-found: ignore
          retention-days: 7
