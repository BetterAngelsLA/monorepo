[tool.nx]
autoActivate = true

[project]
name = "monorepo"
version = "1.0.0"
description = "Better Angels monorepo"
requires-python = ">=3.15,<3.16"
dependencies = ["betterangels-backend"]

[tool.uv]
# cffi 2.0.0 predates cp315 wheels, so `uv sync` builds it from source and
# needs libffi headers the image does not carry. 2.1.x ships cp315 wheels.
constraint-dependencies = ["cffi>=2.1.1", "gevent>=26.9.0", "greenlet>=3.5.6"]

[tool.uv.sources]
betterangels-backend = { workspace = true }

[tool.uv.workspace]
members = ["apps/betterangels-backend"]

[tool.ruff]
line-length = 120
exclude = ["node_modules", ".venv/lib", "*/migrations/*"]
src = ["apps/betterangels-backend"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "boto3-stubs[essential]>=1.43.118,<2",
    "celery-types>=0.26.0,<1",
    "django-stubs[compatible-mypy]>=6.1,<7",
    "django-stubs-ext>=6.1.2,<7",
    "djangorestframework-stubs[compatible-mypy]>=3.18.1,<4",
    "djlint>=1.46.4,<2",
    "faker>=40.43.0,<41",
    "ipython>=9.18.1,<10",
    "model-bakery>=1.24.2,<2",
    "pre-commit>=4.7.0,<5",
    "pytest-django>=4.14.0,<5",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.17.2,<1.0.0",
    "time-machine>=3.5.0,<4",
    "types-gevent>=26.9.0.20261107,<27",
    "types-openpyxl>=3.1.5.20261017,<4",
    "types-python-dateutil>=2.9.0.20261104,<3",
    "types-requests>=2.33.0.20261030,<3",
    "unittest-parametrize>=1.9.0,<2",
    "vcrpy>=8.3.0,<9",
    "virtualenv>=21.14.11,<22",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "betterangels_backend.settings_test"
