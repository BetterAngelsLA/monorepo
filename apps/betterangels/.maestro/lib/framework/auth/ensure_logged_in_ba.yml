appId: ${MAESTRO_APP_ID}
---
# Wait for the bundle to render before inspecting auth state. The dev client
# shows its native "Loading from Metro…" splash until the JS bundle is fetched,
# and no app testID exists until then — a plain notVisible check below would
# pass vacuously and the flow would then skip login on a cold, logged-out app.
- extendedWaitUntil:
    visible:
      id: app-root
    timeout: 120000

# Wait for auth check to settle (authorized-pending indicates auth transition state)
- extendedWaitUntil:
    notVisible:
      id: authorized-pending
    timeout: 10000

- runFlow:
    when:
      visible:
        id: unauthorized-root
    file: login_ba.yml

- extendedWaitUntil:
    visible:
      id: authorized-root
    timeout: 30000
