appId: ${MAESTRO_APP_ID}
---
# for a succesfull `login` flow, the following are required:
#   1. user exists in the database
#   2. user has first and last name
#   3. user has accepted terms of service (hasAcceptedTos) and privacy policy (hasAcceptedPrivacyPolicy)
#       - otherwise the flow will prompt other screens after login

# If we landed on the landing page, open the login screen
- runFlow:
    when:
      visible:
        id: landing-screen
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 300
          id: better-angels-login

# Ensure the login form is visible
- assertVisible:
    id: sign-in-screen

- tapOn:
    waitToSettleTimeoutMs: 300
    id: 'ba-email-input'
- inputText: ${MAESTRO_BA_USER_EMAIL}

# Password field becomes visible once email ending with @example.com
# is entered. This UI transition can destabilize tests and cause failures
# that seem random. Extra pressKey and assertVisible commands
# are meant help stabilize the tests.
- pressKey: Enter

- assertVisible:
    id: ba-password-input

- tapOn:
    waitToSettleTimeoutMs: 300
    id: 'ba-password-input'
- inputText: ${MAESTRO_BA_USER_PASSWORD}

# Press Enter and scroll down until Submit button is visible.
# Sometimes a visible keyboard may interfere with a tap/click.
# `hideKeyboard` is brittle; An alternative is to tapOn
# some safe area (a header etc...) to dismiss the keybaord.
- pressKey: Enter

- waitForAnimationToEnd

- scrollUntilVisible:
    waitToSettleTimeoutMs: 300
    element:
      id: ba-login-submit
    direction: DOWN

- tapOn:
    waitToSettleTimeoutMs: 300
    id: 'ba-login-submit'

# iOS may raise the AutoFill "Save Password?" alert after a successful
# sign-in. It covers the app, so dismiss it here. iOS-only: Android has no
# equivalent system alert.
# NOTE: this is the ONLY place the alert is handled — nothing disables AutoFill
# at the OS/simulator level — so local runs and CI exercise the same path.
# `optional: true` because the alert only appears when iOS decides to offer
# saving the credential; the following assertVisible still fails the flow if
# the alert was missed and left covering the UI.
- runFlow:
    when:
      platform: ios
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 300
          text: 'Not Now'
          optional: true

- assertVisible:
    id: clients-screen
