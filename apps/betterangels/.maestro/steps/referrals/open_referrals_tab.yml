appId: ${MAESTRO_APP_ID}
---
# Opens the first client in the list and selects their Referrals tab.
#
# Precondition:
#   - the clients list is visible (`clients-screen`)
#   - at least one client exists
#   - `ffReferrals` is ENABLED in the target environment — the tab is hidden
#     otherwise, and an unknown/absent waffle flag resolves to false. See
#     README.md → "Feature Flags (ffReferrals)".
# Input env vars: none.
# Output vars: none.
# Side effects: navigates from the clients list into the first client's
# Referrals tab.
#
# Deliberately data-agnostic: taps the first client rather than a named one, so
# the flow does not depend on a particular seed.

- assertVisible:
    id: clients-screen

- tapOn:
    # ids are built by toTestId(['client-card', firstName]), so match the
    # prefix rather than a specific seeded client.
    id: 'client-card-.*'
    index: 0

# Client cards now open the profile summary before the full client screen.
- runFlow:
    when:
      visible: 'See Details'
    commands:
      - tapOn: 'See Details'

# The tab strip is a horizontal ScrollView and `scrollUntilVisible` does not
# reliably drag it, so swipe the tab row left to bring Referrals into view.
# The row's Y depends on the client header (and the device aspect ratio), so
# try a few offsets and fall back when the Referrals screen is not reached.
- assertVisible:
    id: client-tabs-strip

- swipe:
    start: '90%, 30%'
    end: '10%, 30%'
    duration: 400

- waitForAnimationToEnd

- tapOn:
    id: client-tab-referrals
    optional: true

- runFlow:
    when:
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 31%'
          end: '10%, 31%'
          duration: 400
      - waitForAnimationToEnd
      - tapOn:
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 32%'
          end: '10%, 32%'
          duration: 400
      - waitForAnimationToEnd
      - tapOn:
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 33%'
          end: '10%, 33%'
          duration: 400
      - waitForAnimationToEnd
      - tapOn:
          id: client-tab-referrals
          optional: true

- assertVisible:
    id: referrals-screen
