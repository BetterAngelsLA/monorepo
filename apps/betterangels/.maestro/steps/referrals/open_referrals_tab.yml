appId: ${MAESTRO_APP_ID}
---
# Opens the first client in the list and selects their Referrals tab.
#
# Precondition:
#   - the clients list is visible (`clients-screen`)
#   - at least one client exists
#   - `ffReferrals` is ENABLED in the target environment — the tab is hidden
#     otherwise, and an unknown/absent waffle flag resolves to false. See
#     README.md → "Feature Flags (ffReferrals)".
# Input env vars: none.
# Output vars: none.
# Side effects: navigates from the clients list into the first client's
# Referrals tab.
#
# Deliberately data-agnostic: taps the first client rather than a named one, so
# the flow does not depend on a particular seed.

- assertVisible:
    id: clients-screen

- tapOn:
    # ids are built by toTestId(['client-card', firstName]), so match the
    # prefix rather than a specific seeded client.
    id: 'client-card-.*'
    index: 0

# Client cards now open the profile summary before the full client screen.
- runFlow:
    when:
      visible: 'See Details'
    commands:
      - tapOn: 'See Details'

# The client tabs are a horizontal ScrollView, so Referrals starts off-screen
# on every device narrower than the strip. `scrollUntilVisible` does not help:
# it swipes the first scrollable view it finds (the vertical client page), so
# the strip never moves.
#
# The strip's Y depends on the client header height and the device, so measure
# rather than assume — 31% on the iOS 6.3" simulator, 38% on a 1080x2424 phone,
# 45% on the 320x640 CI emulator, 53% on a 320x640 with a taller header (the
# header wraps more). Swipe at each of those offsets, tapping after each, and
# stop as soon as the Referrals screen is up. A horizontal swipe that lands
# outside the strip is a no-op, so the extra attempts are cheap.
- assertVisible:
    id: client-tabs-strip

# 30% — iOS simulator (strip ~31%)
- runFlow:
    when:
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 30%'
          end: '10%, 30%'
          duration: 400
      - waitForAnimationToEnd:
          timeout: 800
      - tapOn:
          id: client-tab-referrals
          optional: true

# 44% / 50% — 320x640 emulator (CI and local, short and tall headers)
- runFlow:
    when:
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 44%'
          end: '10%, 44%'
          duration: 400
      - waitForAnimationToEnd:
          timeout: 800
      - tapOn:
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 50%'
          end: '10%, 50%'
          duration: 400
      - waitForAnimationToEnd:
          timeout: 800
      - tapOn:
          id: client-tab-referrals
          optional: true

# 38% — tall phones (1080x2424)
- runFlow:
    when:
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 38%'
          end: '10%, 38%'
          duration: 400
      - waitForAnimationToEnd:
          timeout: 800
      - tapOn:
          id: client-tab-referrals
          optional: true

# 56% — safety margin for short screens with a tall header
- runFlow:
    when:
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 56%'
          end: '10%, 56%'
          duration: 400
      - waitForAnimationToEnd:
          timeout: 800
      - tapOn:
          id: client-tab-referrals
          optional: true

- assertVisible:
    id: referrals-screen
