appId: ${MAESTRO_APP_ID}
---
# Opens the first client in the list and selects their Referrals tab.
#
# Precondition:
#   - the clients list is visible (`clients-screen`)
#   - at least one client exists
#   - `ffReferrals` is ENABLED in the target environment — the tab is hidden
#     otherwise, and an unknown/absent waffle flag resolves to false. See
#     README.md → "Feature Flags (ffReferrals)".
# Input env vars: none.
# Output vars: none.
# Side effects: navigates from the clients list into the first client's
# Referrals tab.
#
# Deliberately data-agnostic: taps the first client rather than a named one, so
# the flow does not depend on a particular seed.

- assertVisible:
    id: clients-screen

- tapOn:
    # ids are built by toTestId(['client-card', firstName]), so match the
    # prefix rather than a specific seeded client.
    id: 'client-card-.*'
    index: 0

# Client cards now open the profile summary before the full client screen.
- runFlow:
    when:
      visible: 'See Details'
    commands:
      - tapOn: 'See Details'

# The client tabs are a horizontal ScrollView, so Referrals starts off-screen on
# everything narrower than the strip. `scrollUntilVisible` does not help: it
# swipes the first scrollable view it finds (the vertical client page) and only
# at the screen centre, so the strip never moves.
#
# The strip's Y depends on the client header and the device, and the two
# platforms differ enough to need their own offsets:
#   - iOS: strip sits at ~31% on the 6.3" simulator; nudge by 1% per attempt.
#   - Android: measured at 45% on the 320x640 CI emulator and 38% on a
#     1080x2424 phone (53% when the header wraps), so sweep that band.
# Swipe until the Referrals tab is on screen, then tap it. A horizontal swipe
# that lands off the strip is a no-op, so the extra attempts are cheap.
- assertVisible:
    id: client-tabs-strip

- runFlow:
    when:
      platform: ios
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 30%'
          end: '10%, 30%'
          duration: 400
      - waitForAnimationToEnd
      - tapOn:
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      platform: ios
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 31%'
          end: '10%, 31%'
          duration: 400
      - waitForAnimationToEnd
      - tapOn:
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      platform: ios
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 32%'
          end: '10%, 32%'
          duration: 400
      - waitForAnimationToEnd
      - tapOn:
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      platform: ios
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 33%'
          end: '10%, 33%'
          duration: 400
      - waitForAnimationToEnd
      - tapOn:
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      platform: android
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 38%'
          end: '10%, 38%'
          duration: 400
      - waitForAnimationToEnd
      - tapOn:
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      platform: android
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 44%'
          end: '10%, 44%'
          duration: 400
      - waitForAnimationToEnd
      - tapOn:
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      platform: android
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 50%'
          end: '10%, 50%'
          duration: 400
      - waitForAnimationToEnd
      - tapOn:
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      platform: android
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 56%'
          end: '10%, 56%'
          duration: 400
      - waitForAnimationToEnd
      - tapOn:
          id: client-tab-referrals
          optional: true

- assertVisible:
    id: referrals-screen
