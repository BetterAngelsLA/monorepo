appId: ${MAESTRO_APP_ID}
---
# Opens the first client in the list and selects their Referrals tab.
#
# Precondition:
#   - the clients list is visible (`clients-screen`)
#   - at least one client exists
#   - `ffReferrals` is ENABLED in the target environment — the tab is hidden
#     otherwise, and an unknown/absent waffle flag resolves to false. See
#     README.md → "Feature Flags (ffReferrals)".
# Input env vars: none.
# Output vars: none.
# Side effects: navigates from the clients list into the first client's
# Referrals tab.
#
# Deliberately data-agnostic: taps the first client rather than a named one, so
# the flow does not depend on a particular seed.

- assertVisible:
    id: clients-screen

- tapOn:
    # ids are built by toTestId(['client-card', firstName]), so match the
    # prefix rather than a specific seeded client.
    id: 'client-card-.*'
    index: 0

# Client cards now open the profile summary before the full client screen.
- runFlow:
    when:
      visible: 'See Details'
    commands:
      - tapOn: 'See Details'

# The client tabs live in a horizontal ScrollView, so Referrals can sit
# off-screen. How to reach it is platform-dependent:
#   - Android: `scrollUntilVisible` drives the native strip, and the fixed swipe
#     offsets below do not line up with its shorter header — scroll natively
#     first.
#   - iOS: `scrollUntilVisible` does not reliably drag the strip, so swipe it.
#     The row's Y moves with the client header and the device aspect ratio, so
#     the fallbacks retry nearby offsets before failing.
- assertVisible:
    id: client-tabs-strip

- runFlow:
    when:
      platform: android
    commands:
      - scrollUntilVisible:
          element:
            id: client-tab-referrals
          direction: RIGHT
          timeout: 10000
          optional: true
      - waitForAnimationToEnd
      - tapOn:
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      platform: ios
    commands:
      - swipe:
          start: '90%, 30%'
          end: '10%, 30%'
          duration: 400
      - waitForAnimationToEnd
      - tapOn:
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 27%'
          end: '10%, 27%'
          duration: 400
      - waitForAnimationToEnd
      - tapOn:
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 29%'
          end: '10%, 29%'
          duration: 400
      - waitForAnimationToEnd
      - tapOn:
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 31%'
          end: '10%, 31%'
          duration: 400
      - waitForAnimationToEnd
      - tapOn:
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          start: '90%, 33%'
          end: '10%, 33%'
          duration: 400
      - waitForAnimationToEnd
      - tapOn:
          id: client-tab-referrals
          optional: true

- assertVisible:
    id: referrals-screen
