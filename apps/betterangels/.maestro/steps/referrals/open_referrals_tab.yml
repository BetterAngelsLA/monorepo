appId: ${MAESTRO_APP_ID}
---
# Opens the first client in the list and selects their Referrals tab.
#
# Precondition:
#   - the clients list is visible (`clients-screen`)
#   - at least one client exists
#   - `ffReferrals` is ENABLED for the caller in the target environment — the
#     tab is hidden otherwise, and an unknown/absent waffle flag resolves to
#     false. See README.md → "Feature Flags (ffReferrals)".
# Input env vars: none.
# Output vars: none.
# Side effects: navigates from the clients list into the first client's
# Referrals tab.
#
# Deliberately data-agnostic: taps the first client rather than a named one, so
# the flow does not depend on a particular seed.

- assertVisible:
    id: clients-screen

- tapOn:
    waitToSettleTimeoutMs: 300
    # ids are built by toTestId(['client-card', firstName]), so match the
    # prefix rather than a specific seeded client.
    id: 'client-card-.*'
    index: 0

# Client cards now open the profile summary before the full client screen.
- runFlow:
    when:
      visible: 'See Details'
    commands:
      - tapOn:
          text: 'See Details'
          waitToSettleTimeoutMs: 300

# The client tabs are a horizontal ScrollView, so Referrals starts off-screen on
# everything narrower than the strip. `scrollUntilVisible` does not help: it
# swipes the first scrollable view it finds (the vertical client page) and only
# at the screen centre, so the strip never moves.
#
# The strip's Y depends on the client header and the device, and the two
# platforms differ enough to need their own offsets:
#   - iOS: strip centre at ~31% on the 6.3" simulator.
#   - Android: 44% on the 320x640 CI emulator; 38% on a 1080x2424 phone.
# Two attempts per platform: the measured primary, then one fallback. A swipe
# that misses the strip is a no-op, and a missed tap is optional, so the final
# assertion is the single failure point.
- assertVisible:
    id: client-tabs-strip

- runFlow:
    when:
      platform: ios
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          waitToSettleTimeoutMs: 300
          start: '90%, 31%'
          end: '10%, 31%'
          duration: 400
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          waitToSettleTimeoutMs: 300
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      platform: ios
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          waitToSettleTimeoutMs: 300
          start: '90%, 32%'
          end: '10%, 32%'
          duration: 400
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          waitToSettleTimeoutMs: 300
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      platform: android
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          waitToSettleTimeoutMs: 300
          start: '90%, 44%'
          end: '10%, 44%'
          duration: 400
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          waitToSettleTimeoutMs: 300
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      platform: android
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          waitToSettleTimeoutMs: 300
          start: '90%, 38%'
          end: '10%, 38%'
          duration: 400
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          waitToSettleTimeoutMs: 300
          id: client-tab-referrals
          optional: true

- assertVisible:
    id: referrals-screen
