appId: ${MAESTRO_APP_ID}
---
# Opens the first client in the list and selects their Referrals tab.
#
# Precondition:
#   - the clients list is visible (`clients-screen`)
#   - at least one client exists
#   - `ffReferrals` is ENABLED for the caller in the target environment — the
#     tab is hidden otherwise, and an unknown/absent waffle flag resolves to
#     false. See README.md → "Feature Flags (ffReferrals)".
# Input env vars: none.
# Output vars: none.
# Side effects: navigates from the clients list into the first client's
# Referrals tab.
#
# Deliberately data-agnostic: taps the first client rather than a named one, so
# the flow does not depend on a particular seed.

- assertVisible:
    id: clients-screen

- tapOn:
    waitToSettleTimeoutMs: 300
    # ids are built by toTestId(['client-card', firstName]), so match the
    # prefix rather than a specific seeded client.
    id: 'client-card-.*'
    index: 0

# Client cards now open the profile summary before the full client screen.
- runFlow:
    when:
      visible: 'See Details'
    commands:
      - tapOn:
          text: 'See Details'
          waitToSettleTimeoutMs: 300

# The client tabs are a horizontal ScrollView, so Referrals starts off-screen on
# everything narrower than the strip. `scrollUntilVisible` does not help: it
# swipes the first scrollable view it finds (the vertical client page) and only
# at the screen centre, so the strip never moves.
#
# The strip's Y depends on the client header height:
#   - a seeded client (language, pronoun, case manager) puts it at ~31% on the
#     6.3" iOS simulator, 44% on the 320x640 Android emulator and 38% on a
#     1080x2424 phone;
#   - a freshly created client has a shorter header, so the strip sits higher
#     (~25% iOS, ~34% Android).
# Sweep both bands. A swipe that misses the strip is a no-op and a missed tap is
# optional, so the final assertion is the single failure point.
- assertVisible:
    id: client-tabs-strip

# Fast path: on wide screens the tab may already be on screen.
- runFlow:
    when:
      visible:
        id: client-tab-referrals
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 300
          id: client-tab-referrals
      - assertVisible:
          id: referrals-screen

- runFlow:
    when:
      platform: ios
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          waitToSettleTimeoutMs: 300
          start: '90%, 24%'
          end: '10%, 24%'
          duration: 400
      - swipe:
          waitToSettleTimeoutMs: 300
          start: '90%, 24%'
          end: '10%, 24%'
          duration: 400
      - tapOn:
          waitToSettleTimeoutMs: 300
          id: client-tab-referrals
          optional: true

- runFlow:
    when:
      platform: ios
      notVisible:
        id: referrals-screen
    commands:
      - swipe:
          waitToSettleTimeoutMs: 300
          start: '90%, 25%'
          end: '10%, 25%'
          duration: 400
      - swipe:
          waitToSettleTimeoutMs: 300
          start: '90%, 25%'
          end: '10%, 25%'
          duration: 400
      - tapOn:
          waitToSettleTimeoutMs: 300
          id: client-tab-referrals
          optional: true

