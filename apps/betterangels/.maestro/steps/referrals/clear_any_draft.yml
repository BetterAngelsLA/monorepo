appId: ${MAESTRO_APP_ID}
---
# Discards any on-device referral draft so the referral flows start clean.
#
# The draft is persisted in MMKV, so it deliberately survives app restarts —
# which means it also survives across test runs. A flow that aborts midway
# leaves a draft behind, and the next run finds "Resume" where it expected "+".
# Discarding first keeps the referral flows idempotent.
#
# Precondition: the Referrals tab is open (`referrals-screen` visible).
# Input env vars: none.
# Output vars: none.
# Side effects: deletes the persisted draft, so the header shows "+" again.

- assertVisible:
    id: referrals-screen

# Gate on the header button, not the draft card: the header swaps "+" for
# "Resume" synchronously from the draft store, while the draft *card* (and its
# discard button) only renders once the referrals query resolves. Gating on the
# card would race that query and skip the discard on a slow load, leaving
# "Resume" showing for the final assertion.
- runFlow:
    when:
      visible:
        id: resume-referral-btn
    commands:
      # The gate is immediate; the discard control is not. Wait for the card.
      - extendedWaitUntil:
          visible:
            id: referral-draft-card
          timeout: 30000

      - tapOn:
          id: draft-discard-btn
      - assertVisible: 'Discard draft?'
      - tapOn: 'DISCARD'
      - assertNotVisible:
          id: referral-draft-card

- assertVisible:
    id: create-referral-btn
