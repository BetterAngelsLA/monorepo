appId: ${MAESTRO_APP_ID}
---
# FE-28-test — the full Create Referral flow, end to end through the real API.
#
# Submits via the real API and checks the values on the newly created card.
# A unique observation prevents earlier test records from satisfying the checks.
#
# Preconditions:
#   - at least one client, and at least one APPROVED shelter
#   - `ffReferrals` enabled in the target environment (see README.md →
#     "Feature Flags (ffReferrals)")

- stopApp
- runFlow: ../lib/framework/start_test.yml

- runFlow: ../steps/referrals/open_referrals_tab.yml

- runFlow: ../steps/referrals/clear_any_draft.yml

- evalScript: ${output.referralMarker = "referral-e2e-" + Date.now() + "-" + Math.floor(Math.random() * 1000000)}

# ── Start a new referral ────────────────────────────────────────────────────
- tapOn:
    waitToSettleTimeoutMs: 300
    id: create-referral-btn

# The form opens as a full-screen modal; let it settle before asserting content
# that sits below the fold.
- waitForAnimationToEnd

- assertVisible:
    id: referral-intake-screen

- assertVisible: 'Referral information'

# Dev-only legend: ReferralIntakeForm renders it behind `__DEV__`, which is
# true for local Metro sessions but false for the EAS Update bundles the CI
# builds load — so assert it when present instead of failing CI on it.
- assertVisible:
    text: '.*Saved to a dedicated field.*'
    optional: true

# ── Answer intake fields ────────────────────────────────────────────────────
# Storage's requirement is pending; the test supplies it to verify persistence.
# Allow multiple scrolls to settle on a physical device.
- scrollUntilVisible:
    waitToSettleTimeoutMs: 300
    centerElement: true
    element:
      id: storage-AMNESTY_LOCKERS-btn
    direction: DOWN
    timeout: 30000

- tapOn:
    waitToSettleTimeoutMs: 600
    retryTapIfNoChange: true
    id: storage-AMNESTY_LOCKERS-btn

# Android exposes the chip's checked state; iOS does not (see referral_draft).
- runFlow:
    when:
      platform: android
    commands:
      - assertVisible:
          id: storage-AMNESTY_LOCKERS-btn
          checked: true

- scrollUntilVisible:
    waitToSettleTimeoutMs: 300
    centerElement: true
    element:
      id: transportation-AUTOMOBILE-btn
    direction: DOWN
    timeout: 30000

- tapOn:
    waitToSettleTimeoutMs: 600
    retryTapIfNoChange: true
    id: transportation-AUTOMOBILE-btn

- runFlow:
    when:
      platform: android
    commands:
      - assertVisible:
          id: transportation-AUTOMOBILE-btn
          checked: true

- scrollUntilVisible:
    waitToSettleTimeoutMs: 300
    element:
      id: intake-notes-input
    direction: DOWN
    timeout: 30000

- tapOn:
    waitToSettleTimeoutMs: 600
    retryTapIfNoChange: true
    id: intake-notes-input
- inputText: ${output.referralMarker}
- assertVisible: ${output.referralMarker}
- hideKeyboard

# ── Pick a shelter ──────────────────────────────────────────────────────────
- tapOn:
    waitToSettleTimeoutMs: 300
    id: intake-next-btn

- assertVisible:
    id: shelter-picker-screen

- assertVisible: 'Select a Shelter'

# ── Back to the form, then forward again (lossless round trip) ──────────────
# Back is the only exit past intake that keeps the answers. The form remounts
# scrolled to the top, so scroll back down to prove the answer survived.
- tapOn:
    waitToSettleTimeoutMs: 300
    id: picker-back-btn

- assertVisible:
    id: referral-intake-screen

- scrollUntilVisible:
    waitToSettleTimeoutMs: 300
    element:
      id: intake-notes-input
    direction: DOWN
    timeout: 30000

- assertVisible: ${output.referralMarker}

- tapOn:
    waitToSettleTimeoutMs: 300
    id: intake-next-btn

- assertVisible:
    id: shelter-picker-screen

# tap the radio, not the row — the row also contains the "View in Shelter
# Directory" link, and a centre-tap on the row opens the browser instead
- tapOn:
    waitToSettleTimeoutMs: 300
    id: 'shelter-option-radio-.*'
    index: 0

- tapOn:
    waitToSettleTimeoutMs: 300
    id: submit-referral-btn

# ── Submitted: back on the list, values round-tripped from the server ───────
# The success snackbar is transient, so wait for it explicitly rather than
# relying on the default assertion timeout. A failed create shows a different
# (error) snackbar, so this still fails the flow; the durable assertions below
# (screen, draft consumed, round-tripped card) are the real proof of success.
# Soft check: the success snackbar is transient and can be gone by the time the
# list renders (especially on the slower emulator). The card assertions below are
# the durable proof that the create succeeded; a failed create has no matching
# card, so it still fails the flow.
- runFlow:
    when:
      visible:
        text: 'Referral saved. Share it separately to provide a copy.'
    commands:
      - assertVisible:
          text: 'Referral saved. Share it separately to provide a copy.'

- assertVisible:
    id: referrals-screen

# the draft is consumed on success, so the create button returns
- assertVisible:
    id: create-referral-btn

- assertNotVisible:
    id: referral-draft-card

# The intake line renders human labels (field label: option label) and the notes
# line the raw marker. A referral card is taller than a 320px viewport, so
# requiring the whole card (with its descendants) to be visible can never match
# on the CI emulator — scroll to the unique marker line instead, then assert the
# other intake values next to it.
- scrollUntilVisible:
    waitToSettleTimeoutMs: 300
    element:
      text: '${"Notes: " + output.referralMarker}'
    direction: DOWN
    timeout: 30000

- assertVisible: '.*Storage needed: Amnesty Lockers.*'
- assertVisible: '.*Vehicle needing parking: Automobile.*'
