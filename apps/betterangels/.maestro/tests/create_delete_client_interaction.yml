appId: ${MAESTRO_APP_ID}
---
# Requires working Google Maps/Places development credentials to resolve the
# fixed GPS location to the street address asserted below.
- runFlow: ../lib/framework/start_test.yml

- assertVisible:
    id: clients-screen

- assertVisible: 'Clients'

# Ensure fixture client exists and open its profile
- runFlow:
    file: ../lib/screens/clients/visit_fixture_client_profile.yml

# #############################
# Go to Profile Screen ########
# #############################

- assertVisible: 'Profile'
- assertVisible: 'Back'
- assertVisible: ${output.fixtureClientName}

# ###############################
# Go to Interactions Tab ########
# ###############################

# generate unique test data
- evalScript: ${output.interactionId = Date.now()}
- evalScript: ${output.interactionPurpose = "interaction-" + String(output.interactionId)}
- evalScript: ${output.noteCardTestId = "note-card-" + String(output.interactionPurpose)}

# #########################
# Add Interaction ########
# #########################

- tapOn:
    waitToSettleTimeoutMs: 300
    id: 'client-tab-interactions'
- waitForAnimationToEnd

- tapOn:
    waitToSettleTimeoutMs: 300
    id: 'create-interaction-btn'

- assertVisible: 'Add Interaction'

- tapOn:
    waitToSettleTimeoutMs: 300
    id: 'note-purpose-field'
- waitForAnimationToEnd

- tapOn:
    waitToSettleTimeoutMs: 300
    id: 'note-purpose-input'
- extendedWaitUntil:
    visible:
      id: 'note-purpose-input'
    timeout: 2000

- inputText: ${output.interactionPurpose}

# close keyboard
# `hideKeyboard` may not always hit `Done` btn exactly
# and in this case would trigger another tap event
- tapOn:
    text: 'Done'
    waitToSettleTimeoutMs: 300
- waitForAnimationToEnd

# Assert default location set in launch_app.yml
# should match INITIAL_LOCATION in NoteForm/Location
- assertVisible: '727 W 7th St'

# Submit
- tapOn:
    waitToSettleTimeoutMs: 300
    id: 'action-btn-primary'
- waitForAnimationToEnd

# ###################################
# Assert Created Interaction ########
# ###################################

# visit Interactions Tab to confirm
- tapOn:
    waitToSettleTimeoutMs: 300
    id: 'client-tab-interactions'
- waitForAnimationToEnd

# Latest created interaction should be at the top
- extendedWaitUntil:
    visible:
      id: ${output.noteCardTestId}
    timeout: 2000

# ###########################
# Delete Interaction ########
# ###########################

- tapOn:
    waitToSettleTimeoutMs: 300
    id: ${output.noteCardTestId}

- tapOn:
    text: 'Edit'
    waitToSettleTimeoutMs: 300

- scrollUntilVisible:
    waitToSettleTimeoutMs: 300
    element:
      id: delete-note-btn
    direction: DOWN

- tapOn:
    waitToSettleTimeoutMs: 300
    id: delete-note-btn

- tapOn:
    waitToSettleTimeoutMs: 300
    id: delete-modal-confirm-btn

# navigates back to clients-screen
- assertVisible:
    id: client-view-interactions
