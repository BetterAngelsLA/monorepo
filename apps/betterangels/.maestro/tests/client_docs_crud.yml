appId: ${MAESTRO_APP_ID}
---
- runFlow: ../lib/framework/start_test.yml

- assertVisible:
    id: clients-screen

- assertVisible: 'Clients'

# Ensure fixture client exists and open its profile
- runFlow:
    file: ../lib/screens/clients/visit_fixture_client_profile_summary.yml

# #############################
# Go to Profile Screen ########
# #############################

# Go to actual profile screen
- tapOn: 'See Details'
- waitForAnimationToEnd

- assertVisible:
    id: 'client-screen'

# #######################
# Go to Docs Tab ########
# #######################

# Tabs are in a horizontal ScrollView — Docs may be off-screen on narrower
# devices. scrollUntilVisible ensures it's in view before tapping.
- scrollUntilVisible:
    element:
      id: 'client-tab-docs'
    direction: RIGHT
- tapOn:
    id: 'client-tab-docs'
- waitForAnimationToEnd

- assertVisible:
    id: 'client-view-docs'

# ###############################
# Go to Docs Uploads Scren ######
# ###############################
- tapOn:
    id: 'open-client-docs-upload-screen-btn'
- waitForAnimationToEnd

- assertVisible:
    id: 'client-docs-upload-screen'

# We are uploading types that can accept multiple uploads
# so as to avoid being blocked during tests.
# Driver's License accepts 1 upload, so may not be clickable
# if there is a pre-existing upload.
# Should we create fixture profiles unique to each test run,
# as per ticket DEV-2498, then we can update.
- tapOn: 'Consent Forms'

- assertVisible:
    id: 'media-picker-menu'

- tapOn:
    id: 'media-picker-image-btn'

# Pick the seeded image from the native photo picker. The selector differs
# by platform — check `maestro hierarchy` with the picker open to confirm.
- waitForAnimationToEnd

# iOS: PHPicker grid cells have resource-id "PXGGridLayout-Info".
# The seeded image is touched to "now" so it's always the newest → index: 0.
# Consent Forms allows multiple selection, so tap "Add" to confirm.
- runFlow:
    when:
      platform: ios
    commands:
      - tapOn:
          id: 'PXGGridLayout-Info'
          index: 0
      - tapOn:
          id: 'Add'

# Android: photo picker cells have no resource-id — match by accessibility
# text instead. The seeded image is touched to "now" so it's always the
# newest → index: 0. Maestro text matching is full-regex, so use `.*`.
- runFlow:
    when:
      platform: android
    commands:
      - tapOn:
          text: '.*Photo taken on .*'
          index: 0

      - tapOn:
          text: 'Done'

# - assertVisible: 'Upload Complete'
- extendedWaitUntil:
    visible:
      id: 'upload-progress-state-upload-complete'
    timeout: 4000

# ###################################
# Validate upload exists after upload
# ###################################
- tapOn:
    id: 'modal-screen-close-btn'

- assertVisible:
    id: 'client-view-docs'

- assertVisible: 'Forms'

- tapOn:
    id: 'client-docs-accordion-forms'

# The doc name is shown in the list. iOS PHPicker preserves the seeded
# filename (contains ${TEST_RUN_ID}); the Android Photo Picker synthesizes
# DISPLAY_NAME as "<media-id>.jpg" and never exposes the real filename, so on
# Android we match the generic ".jpg" pattern — safe because the pre-flight
# guard above guarantees the accordion was empty of image docs beforehand.
#
# iOS taps the FileCard by its testID ("file-card-..."), NOT the filename
# text: the filename Text is a child of the accessible FileCard Pressable,
# and on iOS tapping the child does not activate the parent's onPress (so the
# DocumentModal never opens). On Android, tapping the ".jpg" text does trigger
# the parent Pressable via touch dispatch.
- runFlow:
    when:
      platform: ios
    commands:
      - assertVisible:
          text: '.*${TEST_RUN_ID}.*'

      - tapOn:
          id: '.*${TEST_RUN_ID}.*'

- runFlow:
    when:
      platform: android
    commands:
      # for Android do only a `soft` validation since seeded photo
      # filenames are not reliable, so check by that some jpg exists
      - assertVisible:
          text: '.*\.jpg.*'

      # part of test is to delete a file, but will just grab
      # first photo in list
      - tapOn:
          id: 'file-card-.*'
          index: 0

# ########################
# Delete the recent upload
# ########################

- waitForAnimationToEnd

- tapOn:
    id: 'delete-file-btn'

- extendedWaitUntil:
    visible:
      id: 'delete-modal-confirm-btn'
    timeout: 3000

- tapOn:
    id: 'delete-modal-confirm-btn'
- waitForAnimationToEnd
# currently there is no success/fail indicator to validate that file was
# deleted.
