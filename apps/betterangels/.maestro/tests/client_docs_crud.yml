appId: ${MAESTRO_APP_ID}
---
- runFlow: ../lib/framework/start_test.yml

- assertVisible:
    id: clients-screen

- assertVisible: 'Clients'

# Ensure fixture client exists and open its profile
- runFlow:
    file: ../lib/screens/clients/visit_fixture_client_profile_summary.yml

# #############################
# Go to Profile Screen ########
# #############################

# Go to actual profile screen
- tapOn: 'See Details'
- waitForAnimationToEnd

- assertVisible:
    id: 'client-screen'

# #######################
# Go to Docs Tab ########
# #######################

# Tabs are in a horizontal ScrollView — Docs may be off-screen on narrower
# devices. scrollUntilVisible ensures it's in view before tapping.
- scrollUntilVisible:
    element:
      id: 'client-tab-docs'
    direction: RIGHT
- tapOn:
    id: 'client-tab-docs'
- waitForAnimationToEnd

- assertVisible:
    id: 'client-view-docs'

# ###############################
# Go to Docs Uploads Scren ######
# ###############################
- tapOn:
    id: 'open-client-docs-upload-screen-btn'
- waitForAnimationToEnd

- assertVisible:
    id: 'client-docs-upload-screen'

# We are uploading types that can accept multiple uploads
# so as to avoid being blocked during tests.
# Driver's License accepts 1 upload, so may not be clickable
# if there is a pre-existing upload.
# Should we create fixture profiles unique to each test run,
# as per ticket DEV-2498, then we can update.
- tapOn: 'Consent Forms'

- assertVisible:
    id: 'media-picker-menu'

- tapOn:
    id: 'media-picker-image-btn'

# Pick the seeded image from the native photo picker. The selector differs
# by platform — check `maestro hierarchy` with the picker open to confirm.
- waitForAnimationToEnd

# iOS: PHPicker grid cells have resource-id "PXGGridLayout-Info".
# The seeded image is touched to "now" so it's always the newest → index: 0.
# Consent Forms allows multiple selection, so tap "Add" to confirm.
- runFlow:
    when:
      platform: ios
    commands:
      - tapOn:
          id: 'PXGGridLayout-Info'
          index: 0
      - tapOn:
          id: 'Add'

# Android: the system photo picker varies by device/OS version. Update after
# running `maestro hierarchy` with the picker open on your Android target.
- runFlow:
    when:
      platform: android
    commands:
      - tapOn:
          id: 'TODO-android-photo-cell-id'
          index: 0
      # If the Android picker has a confirm/done button after selection:
      # - tapOn:
      #     id: 'TODO-android-confirm-btn'

# - assertVisible: 'Upload Complete'
- extendedWaitUntil:
    visible:
      id: 'upload-progress-state-upload-complete'
    timeout: 4000
# Picker dismisses, upload begins. The filename includes our unique run ID
# (e.g. maestro-fixture-ios-1723498745.png) so we can verify deterministically.
# - assertVisible:
#     text: '.*${TEST_RUN_ID}.*'

# ###################################
# Validate upload exists after upload
# ###################################
