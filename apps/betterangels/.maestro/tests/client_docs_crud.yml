appId: ${MAESTRO_APP_ID}
---
- runFlow: ../lib/framework/start_test.yml

- assertVisible:
    id: clients-screen

- assertVisible: 'Clients'

# Ensure fixture client exists and open its profile.
# The helper is flag-agnostic: with ffReferrals on the card opens the profile
# directly, with it off the legacy Profile Summary modal appears first and the
# helper takes its "See Details" exit (see visit_fixture_client_profile.yml).
- runFlow:
    file: ../lib/screens/clients/visit_fixture_client_profile.yml

- assertVisible:
    id: 'client-screen'

# #######################
# Go to Docs Tab ########
# #######################

# Tabs are in a horizontal ScrollView — Docs may be off-screen on narrower
# devices. scrollUntilVisible ensures it's in view before tapping.
- scrollUntilVisible:
    waitToSettleTimeoutMs: 300
    element:
      id: 'client-tab-docs'
    direction: RIGHT
- tapOn:
    waitToSettleTimeoutMs: 300
    id: 'client-tab-docs'
- waitForAnimationToEnd

- assertVisible:
    id: 'client-view-docs'

# ################################
# Go to Docs Uploads Screen ######
# ################################
- tapOn:
    waitToSettleTimeoutMs: 300
    id: 'open-client-docs-upload-screen-btn'
- waitForAnimationToEnd

- assertVisible:
    id: 'client-docs-upload-screen'

# We are uploading types that can accept multiple uploads
# so as to avoid being blocked during tests.
# Driver's License accepts 1 upload, so may not be clickable
# if there is a pre-existing upload.
# Should we create fixture profiles unique to each test run,
# as per ticket DEV-2498, then we can update.
- tapOn:
    text: 'Consent Forms'
    waitToSettleTimeoutMs: 300

- assertVisible:
    id: 'media-picker-menu'

# ###########################
# Capture Camera Image ######
# ###########################
- tapOn:
    waitToSettleTimeoutMs: 300
    id: 'media-picker-camera-btn'

# Camera permission: iOS has NO setPermissions (flaky in CI + unreliable), so
# the system prompt appears on fresh installs — it MUST be accepted inline.
# These runFlows are skipped when no prompt shows (e.g. Android, already
# granted via setPermissions).
#   - iOS camera prompt: Allow / Don't Allow
#   - Android 11+ camera prompt: "While using the app" / "Only this time" /
#     "Don't allow"
- runFlow:
    when:
      visible:
        text: 'Allow'
    commands:
      - tapOn:
          text: 'Allow'
          waitToSettleTimeoutMs: 300
- runFlow:
    when:
      visible:
        text: 'While using the app'
    commands:
      - tapOn:
          text: 'While using the app'
          waitToSettleTimeoutMs: 300
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'camera-view'
    timeout: 4000

- tapOn:
    waitToSettleTimeoutMs: 300
    id: 'camera-capture-btn'

# #####################################
# Validate upload exists on next screen
# #####################################
- extendedWaitUntil:
    visible:
      id: 'client-docs-accordion-forms'
    timeout: 15000

- tapOn:
    waitToSettleTimeoutMs: 300
    id: 'client-docs-accordion-forms'
- waitForAnimationToEnd

# This is a soft check, as there could be a pre-existing uploads
# and we can't easily validate exact filename of latest upload.
# The upload round-trip (camera capture -> API -> list refetch) occasionally
# lands just past the old 15s window on CI runners.
- extendedWaitUntil:
    visible:
      id: 'file-card-.*jpg'
    timeout: 30000

# ##########################
# Delete the `recent` upload
# ##########################

# We can't be sure that this is the most recent upload,
# but allows us to test deletion anyway.
- tapOn:
    waitToSettleTimeoutMs: 300
    id: 'file-card-.*jpg'
    index: 0

- waitForAnimationToEnd

- tapOn:
    waitToSettleTimeoutMs: 300
    id: 'delete-file-btn'

- extendedWaitUntil:
    visible:
      id: 'delete-modal-confirm-btn'
    timeout: 3000

- tapOn:
    waitToSettleTimeoutMs: 300
    id: 'delete-modal-confirm-btn'
- waitForAnimationToEnd
