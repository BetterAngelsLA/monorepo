appId: ${MAESTRO_APP_ID}
---
- runFlow: ../lib/framework/start_test.yml

- assertVisible:
    id: clients-screen

- assertVisible: 'Clients'

# Ensure fixture client exists and open its profile
- runFlow:
    file: ../lib/screens/clients/visit_fixture_client_profile_summary.yml

# #############################
# Go to Profile Screen ########
# #############################

# Go to actual profile screen
- tapOn: 'See Details'
- waitForAnimationToEnd

- assertVisible:
    id: 'client-screen'

# #######################
# Go to Docs Tab ########
# #######################

# Tabs are in a horizontal ScrollView — Docs may be off-screen on narrower
# devices. scrollUntilVisible ensures it's in view before tapping.
- scrollUntilVisible:
    element:
      id: 'client-tab-docs'
    direction: RIGHT
- tapOn:
    id: 'client-tab-docs'
- waitForAnimationToEnd

- assertVisible:
    id: 'client-view-docs'

# ################################
# Go to Docs Uploads Screen ######
# ################################
- tapOn:
    id: 'open-client-docs-upload-screen-btn'
- waitForAnimationToEnd

- assertVisible:
    id: 'client-docs-upload-screen'

# We are uploading types that can accept multiple uploads
# so as to avoid being blocked during tests.
# Driver's License accepts 1 upload, so may not be clickable
# if there is a pre-existing upload.
# Should we create fixture profiles unique to each test run,
# as per ticket DEV-2498, then we can update.
- tapOn: 'Consent Forms'

- assertVisible:
    id: 'media-picker-menu'

# ###########################
# Capture Camera Image ######
# ###########################
- tapOn:
    id: 'media-picker-camera-btn'

# Opening the camera may trigger the native permission prompt (setPermissions
# in start_test.yml is best-effort and Maestro-version dependent). Accept it
# conditionally per platform — these runFlows are skipped when no prompt shows.
#   - iOS camera prompt: Allow / Don't Allow
#   - Android 11+ camera prompt: "While using the app" / "Only this time" /
#     "Don't allow"
- runFlow:
    when:
      visible:
        text: 'Allow'
    commands:
      - tapOn: 'Allow'
- runFlow:
    when:
      visible:
        text: 'While using the app'
    commands:
      - tapOn: 'While using the app'

- waitForAnimationToEnd

- assertVisible:
    id: 'camera-view'

- tapOn:
    id: 'camera-capture-btn'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'upload-progress-state-upload-complete'
    timeout: 4000

# ###################################
# Validate upload exists after upload
# ###################################
- tapOn:
    id: 'modal-screen-close-btn'

- assertVisible:
    id: 'client-view-docs'

- assertVisible: 'Forms'

- tapOn:
    id: 'client-docs-accordion-forms'

# Validate the upload: soft check — the camera photo is named
# "<epoch-ms>.jpg" (unpredictable) on both platforms, so we assert that a .jpg
# doc exists in the accordion rather than matching the exact name.
- assertVisible:
    text: '.*\.jpg.*'

# Open the doc (FileCard) to get the DocumentModal, then delete it. Tapping by
# the FileCard testID prefix (not the filename text) works on both platforms.
- tapOn:
    id: 'file-card-.*'
    index: 0

# ########################
# Delete the recent upload
# ########################

- waitForAnimationToEnd

- tapOn:
    id: 'delete-file-btn'

- extendedWaitUntil:
    visible:
      id: 'delete-modal-confirm-btn'
    timeout: 3000

- tapOn:
    id: 'delete-modal-confirm-btn'
- waitForAnimationToEnd
# Note: there is no success/fail indicator that the file was deleted; the
# post-delete accordion re-check is a future improvement (DEV-2498).
