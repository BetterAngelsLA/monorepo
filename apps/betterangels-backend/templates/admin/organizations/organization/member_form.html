{% extends "admin/base_site.html" %}

{% block content_title %}
  <h1>{{ title }}</h1>
  <p class="help" style="margin: 0 0 16px 0; color: var(--body-quiet-color);">{{ help_text }}</p>
{% endblock %}

{% block content %}
  <form method="post">
    {% csrf_token %}
    <fieldset class="module aligned">
      {{ form.as_div }}
    </fieldset>
    <div class="submit-row">
      <input type="submit" value="{{ submit_label }}" class="default">
      <a href="{{ cancel_url }}" class="closelink">Cancel</a>
    </div>
  </form>
{% endblock %}
