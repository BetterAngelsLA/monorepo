services:
  better-angels:
    ports:
      - '8000:8000'
    env_file:
      - .compose/local.shared.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
      - node_modules:/workspace/node_modules
      - venv:/workspace/.venv
      - .bash_aliases:/home/betterangels/.bash_aliases
  db:
    # Debian 13 (trixie) for GEOS >= 3.12 and PostGIS 3.6, i.e. dev/prod version parity:
    # RDS for PostgreSQL has had GEOS 3.13 since 17.0. **Nothing in the codebase needs the
    # newer version.** `ST_CoverageSimplify` is the one function the old bullseye image could
    # not run, and no code calls it — it was evaluated as an alternative for `geom_display`
    # and not adopted. So this is a dev-environment chore riding along with the regions work
    # rather than a requirement of it, and it can be reverted on its own without touching any
    # of it. See docs/gis/spatial-implementation-audit.md for the parity table.
    image: nickblah/postgis:17.11-trixie-postgis-3.6.4
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    command: postgres -c fsync=off -c full_page_writes=off -c wal_level=minimal -c max_wal_senders=0 -c shared_buffers=512MB -c work_mem=32MB -c maintenance_work_mem=128MB -c effective_cache_size=1GB -c checkpoint_timeout=30min -c max_wal_size=4GB
    volumes:
      - pgdata:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8.0.2

  s3:
    # MinIO images are no longer publicly available (Docker Hub + quay.io).
    # SeaweedFS provides a local S3-compatible API; host :9000 kept for Android adb reverse.
    image: chrislusf/seaweedfs:4.47
    command: mini
    ports:
      - '127.0.0.1:9000:8333' # S3 API: IPv4-only so Android Emulator's adb reverse works
      - '127.0.0.1:8888:8888' # Filer UI — browse buckets/files
      - '127.0.0.1:23646:23646' # Admin UI — cluster/ops
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - S3_BUCKET=betterangels-local
    volumes:
      - s3_data:/data
    healthcheck:
      # S3 root returns 403 without auth; master healthz is a reliable readiness probe.
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9333/cluster/healthz']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v3.30.1
    ports:
      - '127.0.0.1:8080:8080' # Bind host port to IPv4 only so curl localhost hits imgproxy
    env_file:
      - .compose/local.shared.env
    environment:
      # Listen on all interfaces so the host can reach the container (default can be 127.0.0.1)
      - IMGPROXY_BIND=0.0.0.0:8080
      - IMGPROXY_ENABLE_DEBUG_HEADERS=true
      # Allow imgproxy to fetch images from local S3 via s3:// URLs
      - IMGPROXY_USE_S3=true
      - IMGPROXY_S3_ENDPOINT=http://s3:8333
      - IMGPROXY_S3_REGION=us-west-2

volumes:
  node_modules:
  pgdata:
  s3_data:
  venv:
