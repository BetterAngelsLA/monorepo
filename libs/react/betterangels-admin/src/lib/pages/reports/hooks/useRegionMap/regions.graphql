query RegionDimensions {
  regionDimensions
}

query InteractionsByRegion(
  $organizationId: ID!
  $dimension: RegionDimension!
  $startDate: Date
  $endDate: Date
  $regionCodes: [String!]
) {
  interactionsByRegion(
    organizationId: $organizationId
    dimension: $dimension
    startDate: $startDate
    endDate: $endDate
    regionCodes: $regionCodes
  ) {
    code
    name
    count
    isUnassigned
    unassignedReason
  }
}

query RegionsForMap($dimension: RegionDimension!, $codes: [String!]) {
  regions(dimension: $dimension, codes: $codes) {
    kind
    code
    name
    geometry
  }
}

query InteractionMap(
  $organizationId: ID!
  $startDate: Date
  $endDate: Date
  $limit: Int
) {
  interactionMap(
    organizationId: $organizationId
    startDate: $startDate
    endDate: $endDate
    limit: $limit
  ) {
    points {
      latitude
      longitude
    }
    density {
      latitude
      longitude
      count
    }
    truncated
  }
}
