query RegionDimensions {
  regionDimensions {
    value
    label
    plural
  }
}

query InteractionsByRegion(
  $organizationId: ID!
  $dimension: RegionDimension
  $startDate: Date
  $endDate: Date
) {
  interactionsByRegion(
    organizationId: $organizationId
    dimension: $dimension
    startDate: $startDate
    endDate: $endDate
  ) {
    # Which dimension this bucket belongs to. A rollup can span every dimension, where the
    # code alone is ambiguous, so the table has to be able to say which one a row came from.
    kind
    code
    name
    count
    isUnassigned
    unassignedReason
  }
}

query InteractionMap(
  $organizationId: ID!
  $dimension: RegionDimension
  $startDate: Date
  $endDate: Date
  $regionCodes: [String!]
  $limit: Int
) {
  interactionMap(
    organizationId: $organizationId
    startDate: $startDate
    endDate: $endDate
    dimension: $dimension
    regionCodes: $regionCodes
    limit: $limit
  ) {
    points {
      latitude
      longitude
    }
    truncated
    withheld
  }
}

query DensityScale(
  $organizationId: ID!
  $startDate: Date
  $endDate: Date
  $dimension: RegionDimension
  $regionCodes: [String!]
  $zoom: Int!
) {
  densityScale(
    organizationId: $organizationId
    startDate: $startDate
    endDate: $endDate
    dimension: $dimension
    regionCodes: $regionCodes
    zoom: $zoom
  ) {
    p50
    p90
    p95
    max
  }
}

# The density view draws no points, so it asks the one question it cannot answer from a tile:
# a cell-free response is a 204 either way, and an MVT has no field to say which it was.
query InteractionScope($organizationId: ID!, $startDate: Date, $endDate: Date) {
  interactionScope(
    organizationId: $organizationId
    startDate: $startDate
    endDate: $endDate
  ) {
    withheld
  }
}
