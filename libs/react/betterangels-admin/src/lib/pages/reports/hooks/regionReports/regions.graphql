query RegionDimensions {
  regionDimensions {
    value
    label
    plural
  }
}

query InteractionsByRegion(
  $organizationId: ID!
  $dimension: RegionDimension
  $startDate: Date
  $endDate: Date
) {
  interactionsByRegion(
    organizationId: $organizationId
    dimension: $dimension
    startDate: $startDate
    endDate: $endDate
  ) {
    # Which dimension this bucket belongs to. A rollup can span every dimension, where the
    # code alone is ambiguous, so the table has to be able to say which one a row came from.
    kind
    code
    name
    count
    isUnassigned
    unassignedReason
  }
}

query InteractionMap(
  $organizationId: ID!
  $dimension: RegionDimension
  $startDate: Date
  $endDate: Date
  $regionCodes: [String!]
  # Only the density view asks for one: it needs `withheld`, not the pins.
  $limit: Int
) {
  interactionMap(
    organizationId: $organizationId
    startDate: $startDate
    endDate: $endDate
    dimension: $dimension
    regionCodes: $regionCodes
    limit: $limit
  ) {
    points {
      latitude
      longitude
    }
    truncated
    withheld
  }
}
