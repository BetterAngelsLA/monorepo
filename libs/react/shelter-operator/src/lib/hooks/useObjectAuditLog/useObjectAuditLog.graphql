query ObjectAuditLog(
  $targetType: AuditTargetType!
  $objectId: ID!
  # Server-side date/actor/system filters (ADR 0004 §21).
  $filters: AuditEventFilter
  $limit: Int!
  $after: String
) {
  objectAuditLog(
    targetType: $targetType
    objectId: $objectId
    filters: $filters
    limit: $limit
    after: $after
  ) {
    endCursor
    hasNextPage
    results {
      timestamp
      actor
      # The server capped this bulk action's event list.
      truncated
      fieldChanges
      events {
        timestamp
        kind
        action
        summary
        # A synthesized event's unchanged identity (e.g. a netted schedule
        # slot's day/type).
        context
        fieldChanges
      }
    }
  }
}
