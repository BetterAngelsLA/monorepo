query ObjectAuditLog(
  $targetType: AuditTargetType!
  $objectId: ID!
  $dateFrom: DateTime
  $dateTo: DateTime
  $actorId: ID
  $limit: Int!
  $offset: Int!
) {
  objectAuditLog(
    targetType: $targetType
    objectId: $objectId
    dateFrom: $dateFrom
    dateTo: $dateTo
    actorId: $actorId
    limit: $limit
    offset: $offset
  ) {
    timestamp
    actor
    summary
    fieldChanges
    events {
      timestamp
      actor
      kind
      action
      targetType
      targetId
      fieldChanges
    }
  }
}
