query ObjectAuditLog(
  $targetType: AuditTargetType!
  $objectId: ID!
  # Populated by the activity log's date-range controls; omitted entirely when
  # no bound is set. The actor filter extends this same input.
  $filters: AuditEventFilter
  $limit: Int!
  $after: String
) {
  objectAuditLog(
    targetType: $targetType
    objectId: $objectId
    filters: $filters
    limit: $limit
    after: $after
  ) {
    endCursor
    hasNextPage
    results {
      timestamp
      actor
      # The server capped this bulk action's event list; rendered by the
      # activity-log hardening follow-up.
      truncated
      fieldChanges
      events {
        timestamp
        kind
        action
        summary
        # An event's unchanged identity (a schedule slot's day/type, or an
        # exception's dates); rendered as the schedule line's label.
        context
        fieldChanges
      }
    }
  }
}
