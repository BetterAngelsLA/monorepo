query GetShelterOperatorProfile($id: ID!) {
  operatorShelter(pk: $id) {
    accessibility {
      name
    }
    addNotesShelterDetails
    addNotesSleepingDetails
    additionalContacts {
      id
      contactName
      contactNumber
      contactEmail
      contactTitle
      isClaimant
    }
    bedFees
    citiesServed {
      id
      name
    }
    city {
      id
      name
    }
    cityCouncilDistrict
    curfew
    declinedBaVisit
    demographics {
      name
    }
    demographicsOther
    description
    email
    emergencySurge
    entryInfo
    entryRequirements {
      name
    }
    exitPolicy {
      name
    }
    exitPolicyOther
    funders {
      name
    }
    fundersOther
    heroImage(preset: SHELTER_HERO) {
      id
      url
    }
    id
    instagram
    isPrivate
    location {
      latitude
      longitude
      place
    }
    maxStay
    mediaLinks {
      id
      url
      title
      mediaType
    }
    name
    onSiteSecurity
    organization {
      id
      name
    }
    otherRules
    otherServices
    overallRating
    parking {
      name
    }
    pets {
      name
    }
    phone
    photos {
      id
      type
      createdAt
      file {
        name
        url
        urlThumb: url(processingOptions: "rs:fit:400:400/f:jpg")
        urlLg: url(processingOptions: "rs:fit:2400:2000/f:jpg")
      }
    }
    programFees
    referralRequirement {
      name
    }
    roomStyles {
      name
    }
    roomStylesOther
    schedules {
      id
      scheduleType
      day
      startTime
      endTime
      startDate
      endDate
      condition
      demographic {
        name
      }
      isException
    }
    services {
      id
      displayName
      priority
      category {
        id
        displayName
        priority
      }
    }
    shelterPrograms {
      name
    }
    shelterProgramsOther
    shelterTypes {
      name
    }
    shelterTypesOther
    spa {
      id
      name
    }
    spasServed {
      id
      name
      shortName
    }
    specialSituationRestrictions {
      name
    }
    status
    storage {
      name
    }
    subjectiveReview
    supervisorialDistrict
    totalBeds
    updatedAt
    vaccinationRequirement {
      name
    }
    visitorsAllowed
    website
  }
}
