query OperatorShelters(
  $pagination: OffsetPaginationInput
  $filters: OperatorShelterFilter
  $ordering: [ShelterOrder!]! = []
) {
  operatorShelters(
    filters: $filters
    ordering: $ordering
    pagination: $pagination
  ) {
    totalCount
    results {
      id
      name
      location {
        place
      }
      status
      bedCounts {
        available
        inTurnaround
        occupied
        outOfService
        reserved
        total
      }
      organization {
        id
        name
      }
    }
  }
}

query OperatorShelterSummary($id: ID!) {
  operatorShelter(pk: $id) {
    id
    name
    location {
      place
    }
  }
}
