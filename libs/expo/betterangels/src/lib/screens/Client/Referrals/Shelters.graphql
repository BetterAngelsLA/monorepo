query Shelters($pagination: OffsetPaginationInput) {
  shelters(pagination: $pagination) {
    results {
      id
      name
      location {
        place
        latitude
        longitude
      }
      pets {
        name
      }
      demographics {
        name
      }
      accessibility {
        name
      }
      phone
    }
    totalCount
  }
}
