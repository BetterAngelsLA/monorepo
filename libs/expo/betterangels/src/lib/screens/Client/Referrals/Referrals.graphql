query ClientReferrals(
  $filters: ReferralFilter
  $pagination: OffsetPaginationInput
) {
  referrals(filters: $filters, pagination: $pagination) {
    results {
      id
      status
      notes
      createdAt
      createdBy {
        id
        firstName
        lastName
      }
      shelter {
        id
        name
        location {
          place
        }
        pets {
          name
        }
        demographics {
          name
        }
        accessibility {
          name
        }
      }
    }
    totalCount
  }
}

mutation CreateReferral($data: CreateReferralInput!) {
  createReferral(data: $data) {
    ... on ReferralType {
      id
      status
      createdAt
      shelter {
        id
        name
      }
      createdBy {
        id
        firstName
        lastName
      }
    }
    ... on OperationInfo {
      messages {
        kind
        field
        message
      }
    }
  }
}
