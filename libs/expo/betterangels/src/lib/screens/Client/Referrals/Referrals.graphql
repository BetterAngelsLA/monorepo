query ClientReferrals(
  $filters: ReferralFilter
  $pagination: OffsetPaginationInput
) {
  referrals(
    filters: $filters
    pagination: $pagination
    ordering: [{ createdAt: DESC }, { id: DESC }]
  ) {
    results {
      id
      status
      notes
      createdAt
      createdBy {
        id
        firstName
        lastName
      }
      shelter {
        id
        name
        location {
          place
        }
        pets {
          name
        }
        demographics {
          name
        }
        accessibility {
          name
        }
      }
    }
    totalCount
  }
}

mutation UpdateReferral($data: UpdateReferralInput!) {
  updateReferral(data: $data) {
    ... on ReferralType {
      id
      notes
      status
    }
    ... on OperationInfo {
      messages {
        kind
        field
        message
      }
    }
  }
}

mutation CreateReferral($data: CreateReferralInput!) {
  createReferral(data: $data) {
    # The consumer only checks the payload type and the returned id (the list is
    # refetched), so nothing else is requested.
    ... on ReferralType {
      id
    }
    ... on OperationInfo {
      messages {
        kind
        field
        message
      }
    }
  }
}
