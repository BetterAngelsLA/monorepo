services:
  better-angels:
    image: ${MONOREPO_IMAGE}:${DOCKER_TAG}
    # The image already contains this commit's source, node_modules, and .venv.
    # Do NOT bind-mount the checkout over /workspace: that would hide those
    # dependencies and force Docker to copy 2.6 GB into named volumes.
    #
    # Only mutable state is mounted from the runner:
    #   .git    — nx affected needs history; GraphQL checks need `git diff`
    #   .nx     — restored Nx cache / workspace index
    #   .cache  — restored test DB dump + manifest
    #   .ruff_cache/.mypy_cache — writable tool caches
    #   dist/tmp — build/E2E artifacts
    #   reports/coverage — test outputs
    volumes:
      - ${GITHUB_WORKSPACE}/.git:/workspace/.git
      - ${GITHUB_WORKSPACE}/.nx:/workspace/.nx
      - ${GITHUB_WORKSPACE}/.cache:/workspace/.cache
      # Dependencies live in the Actions cache, not in the CI image.
      - ${GITHUB_WORKSPACE}/node_modules:/workspace/node_modules
      - ${GITHUB_WORKSPACE}/.venv:/workspace/.venv
      - ${GITHUB_WORKSPACE}/.yarn:/workspace/.yarn
      # Tool caches are writable state like .nx/.cache. Mounting them also
      # avoids depending on the ownership of cache dirs copied into the image.
      - ${GITHUB_WORKSPACE}/.ruff_cache:/workspace/.ruff_cache
      - ${GITHUB_WORKSPACE}/.mypy_cache:/workspace/.mypy_cache
      - ${GITHUB_WORKSPACE}/dist:/workspace/dist
      # Some Nx build targets stage under tmp/ (e.g. apollo:build).
      - ${GITHUB_WORKSPACE}/tmp:/workspace/tmp
      - ${GITHUB_WORKSPACE}/reports:/workspace/reports
      - ${GITHUB_WORKSPACE}/coverage:/workspace/coverage
      - ${HOME}/.docker/:/home/betterangels/.docker/
      - ${GITHUB_EVENT_PATH}:${GITHUB_EVENT_PATH}:ro
      - /var/run/docker.sock:/var/run/docker.sock
    # Pass in GitHub Actions Envs into the container
    environment:
      - AWS_REGION
      - AWS_ACCOUNT_ID
      - ASSUMED_ROLE
      - ECR_REGISTRY
      - NX_BASE
      - NX_HEAD
      # Keep Nx from leaving a daemon writing the cache while Actions archives
      # .nx; CI has no cross-command daemon benefit worth the race.
      - NX_DAEMON=false
      - BRANCH_NAME
      - SHORT_SHA
      - IMAGE_TAG_PREFIX
      - DOCKER_TAG
      - GITHUB_ACTIONS
      - CI
      # The checkout's .git is mounted over the image's /workspace. Pass
      # safe.directory through Git's env config so the image (and the test DB
      # cache key that hashes the Dockerfile) does not need to change.
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/workspace
      - GITHUB_EVENT_PATH
      - GITHUB_REPOSITORY
      - GITHUB_TOKEN
      - INPUT_GITHUB_TOKEN
      - MONOREPO_IMAGE
      - AWS_DEFAULT_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      # EAS / Expo
      - EXPO_TOKEN
      - SLACK_WEBHOOK_URL
      - GITHUB_EVENT_NAME
      - GITHUB_SHA
      - PR_NUMBER
      - EXPO_PUBLIC_IOS_GOOGLEMAPS_APIKEY
      - EXPO_PUBLIC_ANDROID_GOOGLEMAPS_APIKEY
      - EXPO_PUBLIC_WEB_GOOGLEMAPS_JS_APIKEY
      - EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_IOS
      - EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_ANDROID
      # App Secrets
      - VITE_SHELTER_GOOGLE_MAPS_API_KEY
      - VITE_BETTERANGELS_ADMIN_GOOGLE_MAPS_API_KEY
      - MAESTRO_BA_USER_EMAIL
      - MAESTRO_BA_USER_PASSWORD
