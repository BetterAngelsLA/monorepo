services:
  better-angels:
    image: ${MONOREPO_IMAGE}:ci-base
    # The CI image contains only the toolchain. The checkout and dependencies
    # are bind-mounted, so Docker never copies a 2.6 GB named volume and the
    # source is always this commit's checkout.
    volumes:
      - ${GITHUB_WORKSPACE}:/workspace
      - ${GITHUB_WORKSPACE}/node_modules:/workspace/node_modules
      - ${GITHUB_WORKSPACE}/.venv:/workspace/.venv
      - ${GITHUB_WORKSPACE}/.yarn:/workspace/.yarn
      - ${CI_DOCKER_CONFIG}:/home/betterangels/.docker/
      - ${GITHUB_EVENT_PATH}:${GITHUB_EVENT_PATH}:ro
      - /var/run/docker.sock:/var/run/docker.sock
    # Pass in GitHub Actions Envs into the container
    environment:
      - AWS_REGION
      - AWS_ACCOUNT_ID
      - ASSUMED_ROLE
      - ECR_REGISTRY
      - NX_BASE
      - NX_HEAD
      # Keep Nx from leaving a daemon writing the cache while Actions archives
      # .nx; CI has no cross-command daemon benefit worth the race.
      - NX_DAEMON=false
      # Never let a test/typecheck command rewrite uv.lock mid-run; the test DB
      # manifest hashes uv.lock and a rewritten lock invalidates the next run.
      - UV_LOCKED=1
      - BRANCH_NAME
      - SHORT_SHA
      - IMAGE_TAG_PREFIX
      - DOCKER_TAG
      - CACHE_IMAGE
      - BUILDX_BUILDER
      - GITHUB_ACTIONS
      - CI
      # The checkout's .git is mounted over the image's /workspace. Pass
      # safe.directory through Git's env config so the image (and the test DB
      # cache key that hashes the Dockerfile) does not need to change.
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/workspace
      - GITHUB_EVENT_PATH
      - GITHUB_REPOSITORY
      - GITHUB_TOKEN
      - INPUT_GITHUB_TOKEN
      - MONOREPO_IMAGE
      - AWS_DEFAULT_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      # EAS / Expo
      - EXPO_TOKEN
      - SLACK_WEBHOOK_URL
      - GITHUB_EVENT_NAME
      - GITHUB_SHA
      - PR_NUMBER
      - EXPO_PUBLIC_IOS_GOOGLEMAPS_APIKEY
      - EXPO_PUBLIC_ANDROID_GOOGLEMAPS_APIKEY
      - EXPO_PUBLIC_WEB_GOOGLEMAPS_JS_APIKEY
      - EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_IOS
      - EXPO_PUBLIC_NEW_RELIC_MOBILE_LICENSE_KEY_ANDROID
      # App Secrets
      - VITE_SHELTER_GOOGLE_MAPS_API_KEY
      - VITE_BETTERANGELS_ADMIN_GOOGLE_MAPS_API_KEY
      - MAESTRO_BA_USER_EMAIL
      - MAESTRO_BA_USER_PASSWORD
